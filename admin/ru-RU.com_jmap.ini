COM_JMAP_MAINTITLE_TYPE="Поле главного заголовка"
COM_JMAP_MAINTITLE_TYPE_DESC="Если страница HTML-карты сайта открывается через пункт меню, в качестве главного заголовка можно взять либо название пункта меню, либо заголовок страницы в браузере"
