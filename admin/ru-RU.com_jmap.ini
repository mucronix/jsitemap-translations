COM_JMAP_INSTRUCTIONS_CANVAS="Показывать подсказку"
COM_JMAP_INSTRUCTIONS_CANVAS_DESC="Если параметр включён, над картой сайта выводится подпись с пояснением, как работать с деревом навигации"
COM_JMAP_DRAGGABLE_SITEMAP="Перетаскивание карты сайта"
COM_JMAP_DRAGGABLE_SITEMAP_DESC="Включает или выключает перетаскивание в шаблоне Mindmap"
COM_JMAP_TEMPLATE_OVERRIDE="Переопределение шаблона"
COM_JMAP_TEMPLATE_OVERRIDE_DESC="Если параметр включён, стили и изображения карты сайта можно полностью переопределить, скопировав файлы CSS из папки компонента в папку шаблона. Создайте в папке «css» своего шаблона папку с именем «com_jmap» и скопируйте в неё папку «js» из основной папки компонента на сайте"
COM_JMAP_ENABLE_TREEVIEW_SCRIPTS="Подключать скрипты"
COM_JMAP_ENABLE_TREEVIEW_SCRIPTS_DESC="По умолчанию параметр включён, и все скрипты для работы с деревом карты сайта — разворачивания, сворачивания и прочего — загружаются. Отключайте его, только если нужна статичная карта сайта с заранее развёрнутыми узлами и без взаимодействия с посетителем"

COM_JMAP_DATASOURCE_PARAM="Параметры источника данных"
COM_JMAP_ASPECT_PARAM="Формат и вид"
COM_JMAP_SHOW_EXPANDED="Развернуть все"
COM_JMAP_SHOW_EXPANDED_DESC="При значении «Да» папки карты сайта будут развёрнуты по умолчанию"
COM_JMAP_EXCLUDE_ALL_ARTICLES="Не выводить отдельные материалы в HTML-карте"
COM_JMAP_EXCLUDE_ALL_ARTICLES_DESC="Если параметр включён, из HTML-карты сайта исключаются все отдельные материалы, остаётся только дерево категорий"
COM_JMAP_EXPAND_CURRENT_MENU_FOLDER="Разворачивать папку текущего пункта меню"
COM_JMAP_EXPAND_CURRENT_MENU_FOLDER_SHORT="Разворачивать папку <br/> текущего пункта меню"
COM_JMAP_EXPAND_CURRENT_MENU_FOLDER_DESC="При значении «Да» папка, соответствующая текущему пункту меню, будет развёрнута"
COM_JMAP_JMAPCOLLAPSE="Свернуть папку"
COM_JMAP_JMAPEXPAND="Развернуть папку"

COM_JMAP_COLUMN_SITEMAP="Выводить карту сайта колонками"
COM_JMAP_COLUMN_SITEMAP_SHORT="Выводить карту сайта <br/> колонками"
COM_JMAP_COLUMN_SITEMAP_DESC="При таком выводе карта сайта разбивается на горизонтальные колонки по типам источников данных — «меню», «материалы» и «пользовательские», не более 3 колонок. ВНИМАНИЕ: на шаблон Mindmap SCK этот параметр не влияет, там ширина колонок используется для расчёта их расположения"

COM_JMAP_COLUMN_SITEMAP_MAXNUM="Максимум колонок"
COM_JMAP_COLUMN_SITEMAP_MAXNUM_DESC="При выводе карты сайта колонками можно задать их наибольшее число. Источники данных распределятся по колонкам автоматически, с учётом их количества и наилучшего размещения. ВНИМАНИЕ: на шаблон Mindmap SCK этот параметр не влияет, там ширина колонок используется для расчёта их расположения"

COM_JMAP_MULTILEVEL_CATEGORIES="Многоуровневое дерево папок"
COM_JMAP_MULTILEVEL_CATEGORIES_SHORT="Многоуровневое <br/> дерево папок"
COM_JMAP_MULTILEVEL_CATEGORIES_DESC="Для сторонних расширений JSitemap может построить многоуровневое дерево вложенных папок при выводе элементов компонента в HTML-карте сайта. Учтите: параметр действует только на источники данных поддерживаемых расширений и требует заметных ресурсов, поэтому не включайте его, если в карте тысячи ссылок. На источники, которые и так работают с категориями, он не влияет. ВНИМАНИЕ: на шаблон Mindmap SCK этот параметр не влияет"
COM_JMAP_2_COLUMNS="2 колонки"
COM_JMAP_3_COLUMNS="3 колонки"
COM_JMAP_4_COLUMNS="4 колонки"
COM_JMAP_5_COLUMNS="5 колонок"
COM_JMAP_6_COLUMNS="6 колонок"

COM_JMAP_HIDE_EMPTY_CATS="Прятать пустые категории"
COM_JMAP_HIDE_EMPTY_CATS_DESC="Если параметр включён, пустые категории не показываются в дереве HTML-карты сайта"

COM_JMAP_EXPAND_FIRST_LEVEL="Разворачивать первый уровень"
COM_JMAP_EXPAND_FIRST_LEVEL_DESC="Если параметр включён, папки первого уровня карты сайта развёрнуты по умолчанию"

COM_JMAP_MERGE_ALIAS_MENU="Объединять дерево по псевдонимам меню"
COM_JMAP_MERGE_ALIAS_MENU_DESC="Если в карту сайта входит несколько меню и в них есть пункты типа «псевдоним» со своими подпунктами, связанные с настоящими пунктами, все подпункты псевдонима будут объединены в одно дерево. Например, если есть главное меню и другие меню с пунктами типа «Система — Псевдоним», указывающими на настоящие пункты главного меню, все подпункты псевдонима окажутся в одном дереве под главным меню"

COM_JMAP_MERGE_GENERIC_MENU_BY_CLASS="Объединять источник с пунктом меню"
COM_JMAP_MERGE_GENERIC_MENU_BY_CLASS_DESC="Если в карту сайта входит источник данных стороннего компонента, связанного с пунктом меню, его папку можно объединить с деревом меню. Для этого откройте пункт меню, ведущий на нужный компонент, и включите в нём параметр «Пункт меню карты сайта по умолчанию»"

COM_JMAP_SHOW_TOGGLER="Показывать переключатель папок"
COM_JMAP_SHOW_TOGGLER_DESC="Если параметр включён, в HTML-карте сайта появятся ссылки, разворачивающие и сворачивающие сразу все папки"

COM_JMAP_CREATED_DATE="Только недавние элементы"
COM_JMAP_CREATED_DATE_DESC="Если карта сайта очень большая и содержит тысячи записей, в неё можно включать только недавно созданные элементы. Старые ссылки, уже известные поисковым системам, перестанут попадать в карту — она станет заметно легче"
COM_JMAP_NO_DATE_LIMITS="Все элементы"
COM_JMAP_LAST_MONTH="Созданные за последний месяц"
COM_JMAP_LAST_MONTHS="Созданные за последние %d мес."

COM_JMAP_ORDERBYDATE="Всегда сортировать по дате"
COM_JMAP_ORDERBYDATE_DESC="Если параметр включён, материалы в XML-картах сайта всегда идут по убыванию даты создания. RSS-лента сортируется по дате создания в любом случае"
COM_JMAP_YES_BYDATE_CREATED="Да, по дате создания"
COM_JMAP_YES_BYDATE_MODIFIED="Да, по дате изменения"
COM_JMAP_YES_BYDATE_PUBLISHED="Да, по дате публикации"

COM_JMAP_ORDERBYALPHA="Сортировать HTML-карту по алфавиту"
COM_JMAP_ORDERBYALPHA_DESC="Если параметр включён, всё содержимое HTML-карты сайта упорядочивается по алфавиту. По умолчанию используется порядок Joomla"

COM_JMAP_LIMITFEATURED_ARTICLES="Только избранные материалы"
COM_JMAP_LIMITFEATURED_ARTICLES_DESC="Если параметр включён, этот источник данных загружает только избранные материалы"

COM_JMAP_SHOW_CONTENT_EXPANDED="Развернуть все"
COM_JMAP_SHOW_CONTENT_EXPANDED_DESC="При значении «Да» папки этого источника данных будут развёрнуты по умолчанию"

;Configuration - Component params - Caching and splitting
COM_JMAP_CACHE_STANDARD="Обычный кэш"
COM_JMAP_PRECACHING_AJAX="Предварительное кэширование через AJAX"
COM_JMAP_SPLITTING="Разбиение карты сайта"
COM_JMAP_CACHE="Кэшировать карты сайта"
COM_JMAP_CACHE_DESC="При включённом кэшировании карты сайта сохраняются штатными средствами Joomla!. Это пригодится, если нужно ускорить создание карты сайта"
COM_JMAP_JOOMLA_CACHE_ENABLED=" Кэширование карт сайта включено"
COM_JMAP_JOOMLA_CACHE_ENABLED_DESC="Кэширование карт сайта включено: карты сохраняются и отдаются из кэша, пока не истечёт его срок — тогда создаётся новая карта"
COM_JMAP_JOOMLA_CACHE_DISABLED=" Кэширование карт сайта выключено"
COM_JMAP_JOOMLA_CACHE_DISABLED_DESC="Кэширование карт сайта выключено: карта каждый раз создаётся заново"
COM_JMAP_LIFETIME_CACHE="Срок хранения кэша (дни)"
COM_JMAP_LIFETIME_CACHE_DESC="Задайте срок хранения кэша карт сайта в днях, исходя из того, как часто меняется содержимое сайта. По умолчанию карты хранятся 1 день. При значении «Всегда использовать кэш» срок не истекает никогда: сохранённая карта будет отдаваться, пока вы не удалите её через управление кэшем Joomla. Это удобно, когда карта сайта создаётся слишком долго и робот Google не дожидается ответа"
COM_JMAP_1DAY="1 день"
COM_JMAP_3DAYS="3 дня"
COM_JMAP_1WEEK="1 неделя"
COM_JMAP_2WEEKS="2 недели"
COM_JMAP_1MONTH="1 месяц"
COM_JMAP_USE_ALWAYS="Всегда использовать кэш"
COM_JMAP_RSS_LIFETIME_CACHE="Срок хранения кэша RSS-ленты (минуты)"
COM_JMAP_RSS_LIFETIME_CACHE_DESC="Задайте срок хранения кэша RSS-ленты в минутах, исходя из того, как часто добавляется новое содержимое. По умолчанию лента хранится 60 минут"
COM_JMAP_GNEWS_LIFETIME_CACHE="Срок хранения кэша карты Google News (минуты)"
COM_JMAP_GNEWS_LIFETIME_CACHE_DESC="Задайте срок хранения кэша карты для Google News в минутах, исходя из того, как часто добавляется новое содержимое. По умолчанию карта хранится 60 минут"

COM_JMAP_PRECACHING_ENABLED="Предварительное кэширование через AJAX"
COM_JMAP_PRECACHING_ENABLED_DESC="Позволяет строить большие карты сайта по шагам через AJAX. Для сайтов с множеством ссылок и слабым сервером это зачастую единственный способ получить полную карту изображений. Возможность особенно полезна, когда в карте многие тысячи ссылок и сервер прерывает работу по времени ожидания: карта будет собрана постепенно, шаг за шагом"
COM_JMAP_PRECACHING_LIMIT_XML="Шаг кэширования XML-карт"
COM_JMAP_PRECACHING_LIMIT_XML_DESC="Сколько ссылок обрабатывается за один шаг при создании обычной XML-карты сайта, карты для Google News и карты мобильной версии"
COM_JMAP_PRECACHING_LIMIT_IMAGES="Шаг кэширования карт изображений и видео"
COM_JMAP_PRECACHING_LIMIT_IMAGES_DESC="Сколько ссылок обрабатывается за один шаг при создании карты изображений или видео — для них нужен обход сайта и обращения к внешним API видео"
COM_JMAP_JOOMLA_PRECACHE_ENABLED=" Предварительное кэширование включено"
COM_JMAP_JOOMLA_PRECACHE_ENABLED_DESC="Предварительное кэширование включено: запустить его для нужного формата карты сайта можно в панели SEO. Если выключить эту возможность, все заранее созданные карты перестанут использоваться, даже если они есть на диске"
COM_JMAP_JOOMLA_PRECACHE_DISABLED=" Предварительное кэширование выключено"
COM_JMAP_JOOMLA_PRECACHE_DISABLED_DESC="Предварительное кэширование выключено. После его включения в панели SEO появятся кнопки для запуска кэширования карт сайта"
COM_JMAP_PRECACHING_MULTILANGUAGE_RAWURLS="Обычные адреса для многоязычности"
COM_JMAP_PRECACHING_MULTILANGUAGE_RAWURLS_DESC="Если на многоязычном сайте предварительное кэширование даёт сбои, включите использование обычных адресов для запросов AJAX"

;Configuration - Component params - Advanced settings
COM_JMAP_GNEWS_SITEMAP="Карта для Google News"
COM_JMAP_IMAGES_SITEMAP="Карты изображений и видео"
COM_JMAP_MISC_ACL="SEO, содержимое и права доступа"
COM_JMAP_METAINFO_CONFIG_TITLE="Метаданные для поисковых систем и ИИ"
COM_JMAP_ADVANCED="Расширенные параметры"
COM_JMAP_AUTOPING_SEARCH_ENGINES="Автоуведомление поисковых систем"

COM_JMAP_GNEWS_PUBLICATION_NAME="Название издания для карты Google News"
COM_JMAP_GNEWS_PUBLICATION_NAME_DESC="Укажите название издания, под которым вы зарегистрированы в Google News: оно должно совпадать с названием в карте Google News. По умолчанию берётся название сайта из настроек Joomla!, но если в учётной записи Google оно другое, задайте его здесь"

COM_JMAP_GNEWS_LIMIT_RECENT="Только недавние новости"
COM_JMAP_GNEWS_LIMIT_RECENT_DESC="Google рекомендует включать в карту новостей только материалы, добавленные за последние 2 дня. Если полная карта новостей уже отправлена, а новости выходят ежедневно, этот параметр можно спокойно включить"

COM_JMAP_GNEWS_LIMIT_VALID_DAYS="Число дней для карты Google News"
COM_JMAP_GNEWS_LIMIT_VALID_DAYS_DESC="Выберите, за сколько дней брать новости для карты Google News. Рекомендация Google — 2 дня"

COM_JMAP_ELEMENTS_GNEWS_INCLUDE="Включать элементы в карту Google News"
COM_JMAP_ELEMENTS_GNEWS_INCLUDE_DESC="Укажите, включать ли элементы этого источника в XML-карту для Google News. При значении «Нет» элементы останутся в обычной XML-карте, но в карту Google News не попадут"

COM_JMAP_GNEWS_GENRES="Жанры новостей"
COM_JMAP_GNEWS_GENRES_DESC="Для карты Google News можно указать один или несколько жанров — исходя из того, что публикуется на сайте"
COM_JMAP_NONE="Нет"
COM_JMAP_BLOG="Blog"
COM_JMAP_PRESSRELEASE="PressRelease"
COM_JMAP_SATIRE="Satire"
COM_JMAP_OPED="OpEd"
COM_JMAP_OPINION="Opinion"
COM_JMAP_USERGENERATED="UserGenerated"

COM_JMAP_ELEMENTS_HREFLANG_INCLUDE="Включать элементы в карту hreflang"
COM_JMAP_ELEMENTS_HREFLANG_INCLUDE_DESC="Укажите, включать ли элементы этого источника в XML-карту hreflang. Чтобы связи между элементами Joomla заработали, включите соответствующий параметр в настройках плагина Joomla «Система — Фильтр языка». При значении «Нет» элементы останутся в обычной XML-карте, но в карту hreflang не попадут"

COM_JMAP_ELEMENTS_AMP_INCLUDE="Включать элементы в карту Google AMP"
COM_JMAP_ELEMENTS_AMP_INCLUDE_DESC="Укажите, включать ли элементы этого источника в XML-карту Google AMP. При значении «Нет» элементы останутся в обычной XML-карте, но в карту AMP не попадут"

COM_JMAP_INCLUDE_ARCHIVED_CONTENTS="Включать архивные материалы"
COM_JMAP_INCLUDE_ARCHIVED_CONTENTS_DESC="Укажите, включать ли в карту сайта архивные материалы. Обычно в карту попадают только действующие опубликованные материалы"

COM_JMAP_MULTIPLE_CONTENT_SOURCES="Несколько источников типа «Материалы»"
COM_JMAP_MULTIPLE_CONTENT_SOURCES_DESC="Если параметр включён, в списке источников данных появится флажок для дублирования источника типа «Материалы». Штатный источник этого типа удалить нельзя — только его копии"

COM_JMAP_ENABLE_ARTICLES_EXCLUSIONS="Исключение отдельных материалов"
COM_JMAP_ENABLE_ARTICLES_EXCLUSIONS_DESC="Если параметр включён, в источнике «Материалы» появится список, позволяющий исключить из карты сайта каждый отдельный материал. Отключите его, если материалов слишком много и при изменении источника сервер прерывает работу по времени ожидания или по пределу памяти PHP"

COM_JMAP_IMAGETITLE_PROCESSOR="Откуда брать описание изображения"
COM_JMAP_IMAGETITLE_PROCESSOR_DESC="Выберите, откуда брать описание изображения для карты изображений: из атрибута «title» или «alt». В автоматическом режиме берётся тот, который встретится в теге &lt;img&gt; первым"
COM_JMAP_TITLE_ALT="Автоматически: title или alt"
COM_JMAP_ALWAYS_TITLE="Всегда title"
COM_JMAP_ALWAYS_ALT="Всегда alt"

COM_JMAP_DISABLE_ACL="Учитывать права доступа"
COM_JMAP_DISABLE_ACL_DESC="Если параметр выключен, элементы карты сайта не проверяются на уровень доступа, и гость увидит в карте в том числе элементы для зарегистрированных пользователей"

COM_JMAP_ENABLE_PATTERN_REPLACEMENTS="Замены в содержимом"
COM_JMAP_ENABLE_PATTERN_REPLACEMENTS_DESC="Если параметр включён, замены в содержимом работают и в панели управления, и на сайте"

COM_JMAP_AUTO_EXCLUDE_NOINDEX="Исключать «noindex» автоматически"
COM_JMAP_AUTO_EXCLUDE_NOINDEX_DESC="Если параметр включён, все материалы и пункты меню Joomla! с указанием robots «noindex» автоматически исключаются из всех XML-карт сайта"

COM_JMAP_AUTO_EXCLUDE_HIDDEN_MENU="Исключать скрытые пункты меню"
COM_JMAP_AUTO_EXCLUDE_HIDDEN_MENU_DESC="Если параметр включён, все пункты меню, не выводимые на сайте, автоматически исключаются из HTML-карты сайта"

COM_JMAP_SHOWALWAYS_LANGUAGE_DROPDOWN="Список языков карты сайта"
COM_JMAP_SHOWALWAYS_LANGUAGE_DROPDOWN_DESC="Чтобы создавать отдельные карты сайта для каждого установленного языка, в панели SEO JSitemap показывается список языков. Он появляется сам, если включена штатная многоязычность Joomla!. Если вы пользуетесь сторонним решением, которое не определяется автоматически, и списка нет, можно показывать его принудительно"
COM_JMAP_AUTODETECT="Определять многоязычность"
COM_JMAP_SHOW_ALWAYS="Показывать всегда"

COM_JMAP_LISTS_LIMIT_PAGINATION="Элементов на странице"
COM_JMAP_LISTS_LIMIT_PAGINATION_DESC="Задайте число элементов на одной странице списка. Если анализатор ссылок прерывается по времени ожидания и сервер отдаёт пустую страницу, уменьшите число ссылок на странице — на их проверку будет уходить меньше времени"

COM_JMAP_SELECTABLE_LIMIT_PAGINATION="Элементов в колонке набора"
COM_JMAP_SELECTABLE_LIMIT_PAGINATION_DESC="Задайте число элементов для выбора в каждой колонке при изменении набора источников"

COM_JMAP_SEOSTATS_CUSTOMLINK="Свой адрес для SEO-статистики и проверки в Google"
COM_JMAP_SEOSTATS_CUSTOMLINK_DESC="По умолчанию SEO-статистика в панели управления и проверка индексирования в Google используют домен текущего сайта. При необходимости его можно заменить своим адресом — указывайте полный адрес, например http://www.mysite.com"

COM_JMAP_LINKS_ANALYZER="Анализатор ссылок"
COM_JMAP_LINKSANALYZER_WORKINGMODE="Режим работы анализатора ссылок"
COM_JMAP_LINKSANALYZER_WORKINGMODE_DESC="Переключитесь в режим совместимости, если при запуске анализатора ссылок возникают непонятные ошибки"
COM_JMAP_COMPAT="Режим совместимости"
COM_JMAP_STANDARD="Обычный режим"
COM_JMAP_LINKSANALYZER_VALIDATION_ANALYSIS="Тип проверки"
COM_JMAP_LINKSANALYZER_VALIDATION_ANALYSIS_DESC="Выберите тип проверки анализатора ссылок. По умолчанию ссылки проверяются сразу группой, постранично, как принято в Joomla. В асинхронном режиме каждая ссылка проверяется по очереди уже после загрузки страницы — это помогает избежать превышения времени ожидания, когда ссылок на странице слишком много"
COM_JMAP_ASYNC="Асинхронный режим"
COM_JMAP_LINKSANALYZER_INDEXING_ANALYSIS="Проверять индексирование"
COM_JMAP_LINKSANALYZER_INDEXING_ANALYSIS_DESC="Если параметр включён, анализатор ссылок проверяет для каждой ссылки, попала ли она в индекс"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE="Поисковая система для проверки"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_DESC="Выберите поисковую систему, по которой проверяется наличие ссылок сайта в индексе"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_WEBCRAWLER="WebCrawler"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_GOOGLE="Google"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_BING="BingCrawler"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_SELECTOR_WEBCRAWLER="Селектор результатов WebCrawler"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_SELECTOR_WEBCRAWLER_DESC="По этому значению разбираются результаты WebCrawler. Если сведения об индексировании не приходят ни по одной ссылке, значение, возможно, устарело и его нужно обновить"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_SELECTOR_GOOGLE="Селектор результатов Google"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_SELECTOR_GOOGLE_DESC="По этому значению разбираются результаты Google. Если сведения об индексировании не приходят ни по одной ссылке, значение, возможно, устарело и его нужно обновить"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_SELECTOR_BING="Селектор результатов Bing"
COM_JMAP_LINKSANALYZER_INDEXING_ENGINE_SELECTOR_BING_DESC="По этому значению разбираются результаты Bing. Если сведения об индексировании не приходят ни по одной ссылке, значение, возможно, устарело и его нужно обновить"
COM_JMAP_LINKSANALYZER_SERP_NUMRESULTS="Сколько результатов выдачи проверять"
COM_JMAP_LINKSANALYZER_SERP_NUMRESULTS_DESC="Выберите, сколько результатов поиска просматривает анализатор ссылок при проверке индексирования. По умолчанию — первые 10; если результаты выглядят неверными, уменьшите значение"
COM_JMAP_LINKSANALYZER_TOP_1_RESULT="1 результат"
COM_JMAP_LINKSANALYZER_TOP_2_RESULTS="2 результата"
COM_JMAP_LINKSANALYZER_TOP_3_RESULTS="3 результата"
COM_JMAP_LINKSANALYZER_TOP_4_RESULTS="4 результата"
COM_JMAP_LINKSANALYZER_TOP_5_RESULTS="5 результатов"
COM_JMAP_LINKSANALYZER_TOP_6_RESULTS="6 результатов"
COM_JMAP_LINKSANALYZER_TOP_7_RESULTS="7 результатов"
COM_JMAP_LINKSANALYZER_TOP_8_RESULTS="8 результатов"
COM_JMAP_LINKSANALYZER_TOP_9_RESULTS="9 результатов"
COM_JMAP_LINKSANALYZER_TOP_10_RESULTS="10 результатов"
COM_JMAP_LINKSANALYZER_REMOVE_SEPARATORS="Разбирать адреса"
COM_JMAP_LINKSANALYZER_REMOVE_SEPARATORS_DESC="Если параметр включён, при проверке индексирования анализатор ссылок разбирает адрес по отдельным словам. Отключите его, если результаты выглядят неверными"
COM_JMAP_LINKSANALYZER_REMOVE_SLASHES="Разбирать косые черты в адресах"
COM_JMAP_LINKSANALYZER_REMOVE_SLASHES_DESC="Если параметр включён, при проверке индексирования анализатор ссылок разбирает адрес по словам, не обращая внимания на косые черты. Если результаты выглядят неверными, измените это значение"
COM_JMAP_LINKSANALYZER_REMOVE_MAX_ONE_SLASH="Адреса не более чем с 1 чертой"
COM_JMAP_LINKSANALYZER_REMOVE_MAX_TWO_SLASH="Адреса не более чем с 2 чертами"
COM_JMAP_LINKSANALYZER_REMOVE_MAX_THREE_SLASH="Адреса не более чем с 3 чертами"
COM_JMAP_LINKSANALYZER_PAGESPEED_INSIGHTS_ANALYSIS="Проверка Google PageSpeed Insights"
COM_JMAP_LINKSANALYZER_PAGESPEED_INSIGHTS_ANALYSIS_DESC="Если параметр включён, анализатор ссылок получает для каждой страницы оценку Google PageSpeed Insights по показателям Core Web Vitals. ВАЖНО: для этого должен быть включён и параметр «Проверять индексирование»"
COM_JMAP_LINKSANALYZER_PAGESPEED_INSIGHTS_ANALYSIS_STRATEGY="Тип анализа Google Pagespeed"
COM_JMAP_LINKSANALYZER_PAGESPEED_INSIGHTS_ANALYSIS_STRATEGY_DESC="Выберите, для каких устройств выполнять проверку Google PageSpeed Insights — для компьютеров или для мобильных"
COM_JMAP_LINKSANALYZER_PAGESPEED_INSIGHTS_ANALYSIS_STRATEGY_DESKTOP="Компьютер"
COM_JMAP_LINKSANALYZER_PAGESPEED_INSIGHTS_ANALYSIS_STRATEGY_MOBILE="Мобильное устройство"
COM_JMAP_LINKSANALYZER_EXACT_MATCH_LABEL="Точное совпадение"
COM_JMAP_LINKSANALYZER_EXACT_MATCH="Отметьте, чтобы искать строго по указанному значению"

COM_JMAP_SEOSPIDER_OVERRIDE_HEADINGS="Переопределение заголовков"
COM_JMAP_SEOSPIDER_OVERRIDE_HEADINGS_DESC="Если параметр включён, SEO Spider позволяет переопределять первый заголовок H1, H2 или H3 на странице. Отключите его, если при загрузке страницы возникают ошибки PHP или конфликты"
COM_JMAP_SEOSPIDER_OVERRIDE_HEADINGS_HTML="Теги HTML в заголовках"
COM_JMAP_SEOSPIDER_OVERRIDE_HEADINGS_HTML_DESC="В поле переопределения заголовка можно разрешить теги HTML — по умолчанию допускается только текст. При включённом параметре допустимы теги: &lt;p&gt;&lt;div&gt;&lt;span&gt;&lt;a&gt;&lt;section&gt;&lt;article&gt;&lt;img&gt;&lt;video&gt;&lt;ul&gt;&lt;li&gt;&lt;br&gt; Помните, что для SEO в заголовке должен быть только самый значимый текст страницы"
COM_JMAP_SEOSPIDER_OVERRIDE_CANONICAL="Переопределение canonical"
COM_JMAP_SEOSPIDER_OVERRIDE_CANONICAL_DESC="Если параметр включён, SEO Spider позволяет переопределять тег canonical на страницах. Отключите его, если при загрузке страницы возникают ошибки PHP или конфликты"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY="Задержка обходчика"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_DESC="Можно задать задержку между обращениями SEO Spider к ссылкам. Если значения времени загрузки выглядят завышенными или в результатах случайным образом появляется ошибка 500, скорее всего, сервер не справляется с такой скоростью обхода. В этом случае увеличьте задержку и уменьшите число записей на странице, пока статистика не станет достоверной. Учтите, что ради достоверности результатов проверка времени загрузки работает не более чем для 100 записей на странице. Этот параметр действует и на автоматическое заполнение панели метаданных — он пригодится, если часть строк там остаётся незаполненной"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_ZERO="Без задержки"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_100MS="100 миллисекунд"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_200MS="200 миллисекунд"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_500MS="500 миллисекунд"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_800MS="800 миллисекунд"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_1S="1 секунда"
COM_JMAP_SEOSPIDER_CRAWLER_DELAY_2S="2 секунды"
COM_JMAP_SEOSPIDER_IGNORE_QUERYSTRING="Не учитывать строку запроса"
COM_JMAP_SEOSPIDER_IGNORE_QUERYSTRING_DESC="Если параметр включён, адреса со строкой запроса считаются обычными адресами, а сама строка запроса отбрасывается. Это пригодится, когда канонический адрес нужно применить и к вариантам того же адреса со строкой запроса"

COM_JMAP_SEOSTATS="SEO-статистика"
COM_JMAP_SEOSTATS_DESC="Включает или выключает SEO-статистику в панели управления. При включённом параметре данные запрашиваются у внешнего сервиса; если с этим возникают ошибки, параметр можно отключить"

COM_JMAP_SEOSTATS_SERVICE="Сервис SEO-статистики"
COM_JMAP_SEOSTATS_SERVICE_DESC="Выберите сервис, у которого запрашиваются сведения о вашем сайте"
COM_JMAP_SEOSTATS_SERVICE_STATSCROP="Statscrop"
COM_JMAP_SEOSTATS_SERVICE_XRANKS="XRanks"
COM_JMAP_SEOSTATS_SERVICE_FREESTATS="Freestats"
COM_JMAP_SEOSTATS_SERVICE_ZIGSTAT="Zigstat"
COM_JMAP_SEOSTATS_SERVICE_SITERANKDATA="Siterankdata"
COM_JMAP_SEOSTATS_SERVICE_HYPESTAT="Hypestat"

COM_JMAP_SEOSTATS_SITE_QUERY="Режим поиска для статистики и проверки в Google"
COM_JMAP_SEOSTATS_SITE_QUERY_DESC="Переключает режим работы SEO-статистики и проверки индексирования в Google. В режиме «Точные ссылки сайта» учитываются только проиндексированные ссылки вашего домена. В режиме «Все ссылки домена» учитываются все проиндексированные ссылки, относящиеся к вашему сайту, в том числе со сторонних сайтов"
COM_JMAP_WHOLE_DOMAIN="Все ссылки домена"
COM_JMAP_EXACT_SITE="Точные ссылки сайта"

COM_JMAP_SEOSTATS_GETHOST="Запрос статистики по основному домену"
COM_JMAP_SEOSTATS_GETHOST_DESC="Если SEO-статистика не приходит из-за настроек библиотеки PHP cURL на сервере, включите этот параметр: статистика будет запрашиваться напрямую по основному домену, без перенаправлений"

COM_JMAP_INDEXNOW_APIKEY="<a target='_blank' href='https://www.bing.com/indexnow'>Ключ API IndexNow</a>"
COM_JMAP_INDEXNOW_APIKEY_DESC="Собственный ключ API IndexNow можно получить по адресу https://www.bing.com/indexnow. Если при отправке ссылки в IndexNow возвращается ошибка 403 Forbidden, подтвердите домен: загрузите в корень сервера файл TXT с ключом, как описано в документации IndexNow"

COM_JMAP_GOOGLECUSTOMSEARCH_APIKEY="<a target='_blank' href='https://console.cloud.google.com/apis/library/customsearch.googleapis.com'>Ключ API Google Custom Search</a>"
COM_JMAP_GOOGLECUSTOMSEARCH_APIKEY_DESC="Проверка индексирования в Google и SEO-статистика работают через Google Custom Search API. Если нужна бо́льшая квота, создайте проект в Google Cloud, включите Google Custom Search API и получите свой ключ. По умолчанию используется встроенный ключ"

COM_JMAP_OPENPAGERANK_APIKEY="<a target='_blank' href='https://openpagerank.keywordseverywhere.com/dashboard'>Ключ API Open PageRank</a>"
COM_JMAP_OPENPAGERANK_APIKEY_DESC="Open PageRank API используется для получения оценки PageRank и мирового рейтинга домена в отчёте SEO-статистики. Бесплатный ключ выдаётся после регистрации на сайте OpenPageRank"

COM_JMAP_SERPAPI_APIKEY="<a target='_blank' href='https://serpapi.com/manage-api-key'>Ключ API SerpApi</a>"
COM_JMAP_SERPAPI_APIKEY_DESC="Сервис SerpApi отдаёт результаты поиска Google в реальном времени, включая обычные результаты, проиндексированные страницы и данные об изображениях. Ключ можно получить в личном кабинете SerpApi после бесплатной регистрации. Без него часть данных SEO-статистики из «Freestats» будет недоступна"

COM_JMAP_PROXY_SETTINGS="Настройки прокси-сервера"
COM_JMAP_ENABLE_PROXY="Использовать прокси"
COM_JMAP_ENABLE_PROXY_DESC="Для обращений к внешним сервисам SEO-статистики и проверки индексирования в Google можно использовать прокси-сервер. Он пригодится, если ваш сервер заблокирован со стороны Google"
COM_JMAP_PROXY_SERVER_IPADDRESS="IP-адрес прокси"
COM_JMAP_PROXY_SERVER_IPADDRESS_DESC="Введите IP-адрес прокси-сервера"
COM_JMAP_PROXY_SERVER_PORT="Порт прокси"
COM_JMAP_PROXY_SERVER_PORT_DESC="Введите порт прокси-сервера"
COM_JMAP_PROXY_SERVER_USERNAME="Имя пользователя прокси"
COM_JMAP_PROXY_SERVER_USERNAME_DESC="Если прокси-сервер требует авторизации, введите имя пользователя"
COM_JMAP_PROXY_SERVER_PASSWORD="Пароль прокси"
COM_JMAP_PROXY_SERVER_PASSWORD_DESC="Если прокси-сервер требует авторизации, введите пароль"

COM_JMAP_LIMIT_IMAGES_SITEMAP_REQUESTS="Предел запросов для карт изображений и видео"
COM_JMAP_LIMIT_IMAGES_SITEMAP_REQUESTS_DESC="Если карта сайта большая и сервер не справляется со всеми ссылками при создании карты изображений, ограничьте число запросов при поиске изображений или видео. Рядом с каждым значением указано примерное время создания карты. При ошибках сервера, например «500», попробуйте уменьшить число ссылок или, что лучше, собрать полную карту по шагам через предварительное кэширование. ВНИМАНИЕ: при использовании предварительного кэширования этот предел должен быть не меньше шага кэширования"
COM_JMAP_LIMIT_IMAGES_SITEMAP_REQUESTS_UNLIMITED="Без ограничения"

COM_JMAP_IMAGES_CRAWLER_DELAY="Задержка обхода изображений и видео"
COM_JMAP_IMAGES_CRAWLER_DELAY_DESC="Добавляет паузу между запросами HTTP при обходе для карт изображений и видео. Пригодится, чтобы не получать ошибку 429 (слишком много запросов) на виртуальном хостинге. Значение 0 отключает задержку — так работает по умолчанию."
COM_JMAP_IMAGES_CRAWLER_DELAY_DISABLED="Выключено (без задержки)"

COM_JMAP_REGEX_IMAGES_CRAWLER="Режим обходчика изображений"
COM_JMAP_REGEX_IMAGES_CRAWLER_DESC="Переключает обходчик изображений между двумя режимами. В расширенном режиме он обычно распознаёт изображения в любых случаях, даже если исходный код сжат плагином JCH Optimize. Обычный режим бывает полезен для распознавания отдельных форматов изображений"
COM_JMAP_IMAGES_STANDARD_REGEX="Обычный"
COM_JMAP_IMAGES_ADVANCED_REGEX="Расширенный"

COM_JMAP_FAKE_IMAGES="Распознавать изображения галерей"
COM_JMAP_FAKE_IMAGES_DESC="Если на сайте есть расширения-галереи вроде SigPro Gallery, которые подставляют вместо настоящих изображений заглушки и показывают оригиналы через JavaScript, включите этот параметр: обходчик распознает подменённые изображения по ссылкам"

COM_JMAP_LAZYLOAD_IMAGES="Распознавать отложенные изображения"
COM_JMAP_LAZYLOAD_IMAGES_DESC="Если на сайте есть расширения вроде JCH или Revolution Slider, которые подставляют вместо настоящих изображений заглушки ради отложенной загрузки, включите этот параметр: обходчик распознает подменённые изображения по ссылкам"

COM_JMAP_CUSTOM_IMAGES="Распознавать свои изображения"
COM_JMAP_CUSTOM_IMAGES_DESC="Можно указать свой набор тегов и атрибутов, которые следует считать изображениями"
COM_JMAP_CUSTOM_IMAGES_TAGS="Свои теги изображений"
COM_JMAP_CUSTOM_IMAGES_TAGS_DESC="Укажите через запятую теги, которые нужно считать тегами изображений, например: div, a, p"
COM_JMAP_CUSTOM_IMAGES_ATTRIBUTES="Свои атрибуты изображений"
COM_JMAP_CUSTOM_IMAGES_ATTRIBUTES_DESC="Укажите через запятую атрибуты, которые нужно считать ссылками на изображение, например: data-src, data-image, href, link"

COM_JMAP_IMAGES_FILTER_MODE="Область фильтров для изображений"
COM_JMAP_IMAGES_FILTER_MODE_DESC="Выберите, к чему применять фильтры включения и исключения изображений — ко всему тегу или к отдельному атрибуту. Второй вариант пригодится, например, если у изображения есть атрибут «srcset», а фильтр исключения нужно применить к его настоящему атрибуту «src»"
COM_JMAP_IMAGES_FILTER_MODE_TAG="Тег"
COM_JMAP_IMAGES_FILTER_MODE_ATTRIBUTE="Атрибут"

COM_JMAP_INCLUDE_DESCRIPTION_ONLY="Только изображения с описанием"
COM_JMAP_INCLUDE_DESCRIPTION_ONLY_DESC="Если параметр включён, в карту попадут только изображения, у которых заполнен атрибут title или alt, используемый как описание"

COM_JMAP_SH404SEF_MULTILANGUAGE="Совместимость с многоязычностью Sh404SEF"
COM_JMAP_SH404SEF_MULTILANGUAGE_DESC="Если на многоязычном сайте работает sh404SEF и его параметр «Вставлять код языка в адрес» выключен, адреса сайта не содержат метки языка. Включать такую метку — правильная практика для SEO и индексирования, но если она отключена, при переходе по ссылкам возникают перенаправления HTTP 303, и обходчик изображений и видео не находит файлы. В этом случае включите этот параметр, чтобы обходчик работал правильно"

; Rss feeds
COM_JMAP_RSS_FEED="RSS-ленты"
COM_JMAP_RSS_CHANNEL_NAME="Название канала"
COM_JMAP_RSS_CHANNEL_NAME_DESC="Задайте своё название канала RSS-ленты. Если поле пустое, берётся название сайта из общих настроек Joomla"
COM_JMAP_RSS_CHANNEL_DESCRIPTION="Описание канала"
COM_JMAP_RSS_CHANNEL_DESCRIPTION_DESC="Укажите описание вашего канала RSS"
COM_JMAP_RSS_CHANNEL_IMAGE="Изображение канала"
COM_JMAP_RSS_CHANNEL_IMAGE_DESC="К каналу RSS можно добавить изображение-логотип"
COM_JMAP_RSS_WEBMASTER_EMAIL="Адрес электронной почты вебмастера"
COM_JMAP_RSS_WEBMASTER_EMAIL_DESC="Укажите адрес электронной почты вебмастера для канала RSS. Если поле пустое, берётся адрес из настроек Joomla"
COM_JMAP_RSS_WEBMASTER_NAME="Имя вебмастера"
COM_JMAP_RSS_WEBMASTER_NAME_DESC="Укажите имя вебмастера для канала RSS. Если поле пустое, берётся имя отправителя из настроек Joomla"
COM_JMAP_RSS_CHANNEL_EXCLUDE_WORDS="Слова, исключаемые из описаний RSS"
COM_JMAP_RSS_CHANNEL_EXCLUDE_WORDS_DESC="Если в материалах используются вставки плагинов вроде {loadposition}, их можно исключить из описаний RSS-ленты. Для этого перечислите их в этом поле через запятую, например: {loadposition}, {loadmodule}"
COM_JMAP_RSS_LIMIT_VALID_DAYS="Ограничение RSS по числу дней"
COM_JMAP_RSS_LIMIT_VALID_DAYS_DESC="В RSS-ленту можно включать только недавние материалы Joomla. Укажите, за сколько дней их брать. ВНИМАНИЕ: ограничение действует ТОЛЬКО на обычные материалы Joomla из источника типа «Материалы»"
COM_JMAP_RSS_LIMIT_RECENT="Ограничение RSS по числу записей"
COM_JMAP_RSS_LIMIT_RECENT_DESC="В RSS-ленту можно включать только последние записи из разных источников данных. Укажите их число. ВНИМАНИЕ: ограничение действует на все источники, участвующие в создании ленты, и считается для каждого источника отдельно"
COM_JMAP_RSS_PROCESS_CONTENT_PLUGINS="Обрабатывать плагинами содержимого"
COM_JMAP_RSS_PROCESS_CONTENT_PLUGINS_DESC="Если параметр включён, текст описания в RSS-ленте обрабатывается плагинами Joomla группы «content» для источника «Материалы». ВНИМАНИЕ: не все плагины, например {loadmodule}, работают в формате RSS. В таком случае уберите вставку плагина из текста ленты параметром исключения слов"
COM_JMAP_RSS_INCLUDE_IMAGES="Включать изображения материалов"
COM_JMAP_RSS_INCLUDE_IMAGES_DESC="В RSS-ленту можно включать вступительное изображение или изображение полного текста материалов Joomla"
COM_JMAP_RSS_INCLUDE_IMAGES_INTRO="Вступительное изображение"
COM_JMAP_RSS_INCLUDE_IMAGES_FULL="Изображение полного текста"
COM_JMAP_RSS_INCLUDE_IMAGES_BOTH="Оба изображения"
COM_JMAP_RSS_INCLUDE_AUTHOR="Включать автора материала"
COM_JMAP_RSS_INCLUDE_AUTHOR_DESC="В RSS-ленту можно включать сведения об авторе материалов Joomla"
COM_JMAP_RSS_INCLUDE_FULLTEXT="Включать полный текст материала"
COM_JMAP_RSS_INCLUDE_FULLTEXT_DESC="В RSS-ленту можно включать поле полного текста материалов Joomla и K2 — в нём хранится текст после разделителя «Подробнее»"
COM_JMAP_RSS_USE_METADESC="Использовать мета-описание материала"
COM_JMAP_RSS_USE_METADESC_DESC="Если параметр включён, в RSS-ленте вместо текста материала используется его мета-описание. Полный текст при этом можно оставить включённым"

COM_JMAP_GEO_SITEMAP="Карта Geo"
COM_JMAP_GEO_SITEMAP_ENABLED="Карта Geo"
COM_JMAP_GEO_SITEMAP_ENABLED_DESC="При включённой карте Geo ссылка на неё появляется в панели SEO в главной панели управления"
COM_JMAP_GEO_SITEMAP_ADDRESS="Адрес сайта или компании"
COM_JMAP_GEO_SITEMAP_ADDRESS_DESC="Укажите адрес, по которому в карте Geo определяется расположение вашего сайта или компании. Адрес можно ввести в формате Google Maps, например: 526 Park Avenue, New York 10007, United States"
COM_JMAP_GEO_SITEMAP_NAME="Название"
COM_JMAP_GEO_SITEMAP_NAME_DESC="Укажите название компании или сайта для карты Geo"
COM_JMAP_GEO_SITEMAP_AUTHOR="Автор"
COM_JMAP_GEO_SITEMAP_AUTHOR_DESC="Укажите имя автора для карты Geo"
COM_JMAP_GEO_SITEMAP_DESCRIPTION="Описание"
COM_JMAP_GEO_SITEMAP_DESCRIPTION_DESC="Укажите описание компании или сайта для карты Geo"

COM_JMAP_AMP_SITEMAP="Карта Google AMP"
COM_JMAP_AMP_SITEMAP_ENABLED="Карта Google AMP"
COM_JMAP_AMP_SITEMAP_ENABLED_DESC="При включённой карте Google AMP ссылка на неё появляется в панели SEO в главной панели управления. Отправлять такую карту следует, только если у сайта есть AMP-версия, созданная плагинами вроде JAmp"
COM_JMAP_AMP_SUFFIX="Окончание AMP-адресов"
COM_JMAP_AMP_SUFFIX_DESC="Окончание, с которым создаются AMP-страницы и ссылки на них. По умолчанию — «amp»; измените его, если в плагине, создающем AMP-страницы, например JAmp, задано другое"
COM_JMAP_AMP_SEF_SUFFIX_ENABLED="Окончание ЧПУ в адресе"
COM_JMAP_AMP_SEF_SUFFIX_ENABLED_DESC="Если в общих настройках Joomla! включён параметр «Добавлять суффикс к URL», но его значение меняет стороннее ЧПУ-расширение вроде sh404sef, включите этот параметр, чтобы при создании AMP-адресов использовалось правильное значение"

COM_JMAP_ENABLE_SITEMAP_SEF_LINKS="ЧПУ-адреса для карт сайта"
COM_JMAP_ENABLE_SITEMAP_SEF_LINKS_DESC="Укажите, создавать ли ссылки на карты сайта и отправлять их поисковым системам в режиме ЧПУ Joomla"

COM_JMAP_SITEMAP_LINKS_FORCE_FORMAT="Принудительный формат ЧПУ-ссылок"
COM_JMAP_SITEMAP_LINKS_FORCE_FORMAT_DESC="Если ЧПУ-адреса для карт сайта включены, а вместо XML-карты открывается HTML-страница, включите этот параметр: он исправляет ошибки маршрутизации, которые часто возникают при установленных сторонних расширениях вроде sh404sef или плагинах"

COM_JMAP_ENABLE_SITEMAP_RANDOM_LINKS="Случайные ссылки для карт сайта"
COM_JMAP_ENABLE_SITEMAP_RANDOM_LINKS_DESC="Если в Google Search Console возникают проблемы с кэшированием, можно заставить его заново получить карты сайта с помощью случайных ссылок. Search Console нередко кэширует статистику карты и показывает меньше проиндексированных ссылок, чем есть; отправка случайной ссылки заставляет Google получить карту заново и обновить статистику. При включённом параметре к ссылкам на карты добавляется дополнительный параметр «ver=xxxxx»"

COM_JMAP_ENABLE_AUTOPING="Автоуведомление по записям Ping-O-Matic"
COM_JMAP_ENABLE_AUTOPING_DESC="Если параметр включён, при сохранении материала, ссылка на который есть в списке записей Ping-O-Matic, уведомление сервисам Ping-O-Matic отправляется заново автоматически"

COM_JMAP_ENABLE_DEFAULT_AUTOPING="Автоуведомление Ping-O-Matic и IndexNow"
COM_JMAP_ENABLE_DEFAULT_AUTOPING_DESC="Если параметр включён, при сохранении материала уведомление автоматически отправляется сервисам Ping-O-Matic, IndexNow и Weblogs — это увеличивает посещаемость сайта"

COM_JMAP_ENABLE_DEFAULT_AUTOPING_SINGLE_ARTICLE="Уведомление по ссылке материала"
COM_JMAP_ENABLE_DEFAULT_AUTOPING_SINGLE_ARTICLE_DESC="Если параметр включён, при сохранении материала уведомление отправляется по точной ссылке на сам материал. Если выключен — по ссылке на родительский пункт меню, в котором материал находится"

COM_JMAP_ENABLE_DEFAULT_AUTOPING_SINGLE_PRODUCT="Уведомление по ссылке товара"
COM_JMAP_ENABLE_DEFAULT_AUTOPING_SINGLE_PRODUCT_DESC="Если параметр включён, при сохранении товара в расширениях вроде VirtueMart уведомление автоматически отправляется по точной ссылке на сам товар"

COM_JMAP_ENABLE_DEFAULT_AUTOPING_SINGLE_PAGEBUILDER="Уведомление по ссылке страницы конструктора"
COM_JMAP_ENABLE_DEFAULT_AUTOPING_SINGLE_PAGEBUILDER_DESC="Если параметр включён, при сохранении страницы, созданной конструктором вроде JPageBuilder или SP Page Builder, уведомление автоматически отправляется по точной ссылке на эту страницу"

COM_JMAP_GOOGLE_INDEXING_API="Google Indexing API"
COM_JMAP_ENABLE_GOOGLE_INDEXING_API="Google Indexing API"
COM_JMAP_ENABLE_GOOGLE_INDEXING_API_DESC="Включите Google Indexing API и нажмите «Сохранить настройки», чтобы параметры применились. С включённым Google Indexing API адреса можно автоматически отправлять в Google при создании и изменении материалов в панели управления Joomla, не дожидаясь, пока Google обойдёт карту сайта. Это заметно ускоряет индексирование новых адресов и обход обновлённого содержимого. Чтобы возможность заработала, войдите в учётную запись Google и пройдите проверку кнопкой «ШАГ 1». Полученный код авторизации вставьте в поле «ШАГ 2» и сохраните настройки"
COM_JMAP_GOOGLE_INDEXING_AUTHENTICATION="ШАГ 1: нажмите эту кнопку, чтобы получить код авторизации Google"
COM_JMAP_GOOGLE_INDEXING_AUTHENTICATION_DESC="Нажмите эту кнопку, чтобы войти и пройти проверку в учётной записи Google, которая является полноправным владельцем этого домена в Google Search Console. Полученный от Google код авторизации вставьте в поле ниже и сохраните настройки"
COM_JMAP_START_GOOGLE_AUTHENTICATION="Войти и пройти проверку в Google"
COM_JMAP_START_GOOGLE_AUTHENTICATION_DESC="Войдите в учётную запись Google, которая является полноправным владельцем этого домена в Google Search Console, и разрешите приложению «JSitemap Indexing» отправлять адреса на индексирование и обход"
COM_JMAP_START_GOOGLE_INDEXING_DISABLED="Google Indexing API выключен, сохраните настройки"
COM_JMAP_START_GOOGLE_INDEXING_DISABLED_DESC="Включите Google Indexing API и нажмите «Сохранить настройки», чтобы эта возможность заработала"
COM_JMAP_GOOGLE_AUTHENTICATION_LOGOUT="Включено — нажмите, чтобы выйти и сбросить проверку"
COM_JMAP_GOOGLE_AUTHENTICATION_LOGOUT_DESC="Нажмите эту кнопку, чтобы выйти из Google и сбросить код авторизации"
COM_JMAP_GOOGLE_INDEXING_AUTHCODE="ШАГ 2: введите код авторизации и сохраните настройки"
COM_JMAP_GOOGLE_INDEXING_AUTHCODE_DESC="Полученный код авторизации вставьте в это поле и сохраните настройки, чтобы включить Google Indexing API"
COM_JMAP_PHP_VERSION_UNSUPPORTED="Версия PHP не поддерживается, требуется PHP не ниже 7.2.5"
COM_JMAP_PHP_VERSION_UNSUPPORTED_DESC="Выбранный API не поддерживается вашей версией PHP. Для работы с Google Indexing API требуется PHP не ниже 7.2.5"
COM_JMAP_GOOGLE_AUTHENTICATION_ENABLED="Google Indexing API включён"
COM_JMAP_GOOGLE_INDEXING_APIKEY="Свой ключ API Google"
COM_JMAP_GOOGLE_INDEXING_APIKEY_DESC="Введите свой ключ API Google, если вы настроили собственное приложение Google для Google Indexing API. Это может понадобиться, чтобы получить бо́льшую квоту по сравнению со встроенным приложением. Оставьте поле пустым, чтобы использовать встроенное приложение; как создать своё, описано в документации PDF"
COM_JMAP_GOOGLE_INDEXING_CLIENTID="Свой идентификатор клиента Google"
COM_JMAP_GOOGLE_INDEXING_CLIENTID_DESC="Введите свой идентификатор клиента Google, если вы настроили собственное приложение Google для Google Indexing API. Это может понадобиться, чтобы получить бо́льшую квоту по сравнению со встроенным приложением. Оставьте поле пустым, чтобы использовать встроенное приложение; как создать своё, описано в документации PDF"
COM_JMAP_GOOGLE_INDEXING_SECRET="Свой секретный код Google"
COM_JMAP_GOOGLE_INDEXING_SECRET_DESC="Введите свой секретный код Google, если вы настроили собственное приложение Google для Google Indexing API. Это может понадобиться, чтобы получить бо́льшую квоту по сравнению со встроенным приложением. Оставьте поле пустым, чтобы использовать встроенное приложение; как создать своё, описано в документации PDF"

COM_JMAP_APPEND_LIVESITE="Добавлять домен сайта"
COM_JMAP_APPEND_LIVESITE_DESC="Если параметр включён, ко всем ссылкам в карте сайта добавляется домен вашего сайта, например: http://www.yourdomain.com"

COM_JMAP_DISABLE_PRIORITY="Не выводить приоритет"
COM_JMAP_DISABLE_PRIORITY_DESC="Убирает тег приоритета из XML-карты сайта. Это уменьшает её размер"

COM_JMAP_DISABLE_CHANGEFREQ="Не выводить частоту изменения"
COM_JMAP_DISABLE_CHANGEFREQ_DESC="Убирает тег частоты изменения из XML-карты сайта. Это уменьшает её размер"

COM_JMAP_CUSTOM_SITEMAP_DOMAIN="Свой домен для карт сайта"
COM_JMAP_CUSTOM_SITEMAP_DOMAIN_DESC="Здесь можно задать свой домен для ссылок на карты сайта в панели SEO. Указывайте домен полностью, вместе с протоколом, например http://www.mysite.com или https://www.mysite.com"

COM_JMAP_CUSTOM_HTTP_PORT="Свой порт HTTP"
COM_JMAP_CUSTOM_HTTP_PORT_DESC="Добавляет к ссылкам карты сайта свой порт HTTP — например, если сайт разрабатывается на тестовом сервере с портом 8080"

COM_JMAP_MEMORY_LIMIT_MANAGEMENT="Управление ресурсами"
COM_JMAP_MEMORY_LIMIT_MANAGEMENT_DESC="Выберите, как распределяются ресурсы при создании карты сайта. Для больших карт PHP может потребоваться много памяти и времени, поэтому по умолчанию предел памяти и время ожидания запрашивает сам компонент, беря максимум доступного. Если ваш сервер не позволяет управлять ресурсами из кода PHP, возможны непонятные ошибки — тогда переключитесь на управление со стороны сервера"
COM_JMAP_SERVER="Со стороны сервера"
COM_JMAP_COMPONENT="Со стороны компонента"

COM_JMAP_FORMATTED_SITEMAPS_ENGINE="Отображение оформленных карт сайта"
COM_JMAP_FORMATTED_SITEMAPS_ENGINE_DESC="Выберите, как показывать оформленные XML-карты сайта: средствами XSLT самого браузера или через расширенный просмотр JSitemap."
COM_JMAP_FORMATTED_SITEMAPS_ENGINE_COMPONENT_VIEWER="Просмотр JSitemap"
COM_JMAP_FORMATTED_SITEMAPS_ENGINE_NATIVE_BROWSER="Средствами браузера"

COM_JMAP_APPS_GLOBAL_SEARCH="Режим общего поиска"
COM_JMAP_APPS_GLOBAL_SEARCH_DESC="Действует в панели метаданных для поисковых систем и ИИ, в анализаторе ссылок и в SEO Spider.<br/><strong>Нет (по умолчанию)</strong>: поиск отбирает элементы только на текущей странице. Быстрее при большом объёме данных, но охват поиска ограничен.<br/><strong>Да</strong>: поиск отбирает элементы по всем данным до разбиения на страницы. Работает как обычный поиск, но при тысячах ссылок может быть медленнее"

COM_JMAP_PREPROCESS_ROUTE_HELPERS="Предобработка маршрутизаторов"
COM_JMAP_PREPROCESS_ROUTE_HELPERS_DESC="Если параметр включён, ссылки компонентов со своими маршрутизаторами — Virtuemart, Easyblog и подобных — обрабатываются до правил построения адресов Joomla, чтобы получились правильные ссылки на пункты меню. Для создания ссылок Virtuemart без пути категорий этот параметр, возможно, придётся отключить"

COM_JMAP_REMOVE_SITEMAP_SERP="Убрать XML-карты из выдачи"
COM_JMAP_REMOVE_SITEMAP_SERP_DESC="Если Google показывает ссылки на XML-карты сайта в результатах поиска и вы этого не хотите, включите параметр: к картам добавляется особый заголовок X-Robots-Tag, и ссылки на них перестают индексироваться. После включения проверьте, что Google по-прежнему может получать ваши XML-карты"

COM_JMAP_REMOVE_HOME_SLASH="Убрать косую черту у главной"
COM_JMAP_REMOVE_HOME_SLASH_DESC="Если параметр включён, у ссылки на главную страницу убирается завершающая косая черта. Обычно Joomla создаёт канонический адрес главной с ней — https://www.mysite.com/; если вам нужно, чтобы в карте сайта он был без неё, включите этот параметр, и адрес будет таким: https://www.mysite.com"

COM_JMAP_ADVANCED_MULTILANGUAGE="Доступ роботов к многоязычным ссылкам"
COM_JMAP_ADVANCED_MULTILANGUAGE_DESC="Переключает режим доступа поисковых роботов к ссылкам многоязычных карт сайта. Если при отправке карт в Google Search Console возникают ошибки, переключитесь в расширенный режим"
COM_JMAP_MODE_STANDARD="Обычный"
COM_JMAP_MODE_ADVANCED="Расширенный"

COM_JMAP_SOCKET_MODE="Режим соединений"
COM_JMAP_SOCKET_MODE_DESC="Выберите режим соединения с внешними и локальными серверами. Если на хостинге установлен модуль IPV6, возможно, понадобится переключиться на режим по IP"
COM_JMAP_IPMODE="По IP"
COM_JMAP_DNSMODE="По DNS"

COM_JMAP_FORCE_CRAWLER_HTTP="Обход по протоколу «http»"
COM_JMAP_FORCE_CRAWLER_HTTP_DESC="Если на сайте установлен сертификат SSL и он работает по https, а при обходе для карт изображений и видео возникают ошибки сервера, можно заставить обходчик использовать при сканировании ссылок обычный протокол http"

COM_JMAP_SH404SEF_MULTILANG="Кэширование с многоязычностью Sh404SEF"
COM_JMAP_SH404SEF_MULTILANG_DESC="Включите этот параметр, если при создании карт сайта через предварительное кэширование возникают ошибки, а многоязычностью сайта управляет Sh404SEF"

COM_JMAP_MENUID_SITEMAP_LINKS="ID пункта меню для ЧПУ-ссылок карты сайта"
COM_JMAP_MENUID_SITEMAP_LINKS_DESC="Если HTML-карта сайта открывается через пункт меню, укажите его ID — и его ЧПУ-алиас, которым управляет Joomla, будет применён и к остальным ЧПУ-ссылкам карт сайта в панели SEO. Так вместо http://yoursite.com/component/jmap/sitemap/xml получится http://yoursite.com/site-map/sitemap/xml. Это особенно удобно, если в robots.txt закрыты адреса со словами «index.php» или «component»"

COM_JMAP_METAINFO_AUTO_GENERATE_METATITLE="Создавать мета-заголовок самостоятельно"
COM_JMAP_METAINFO_AUTO_GENERATE_METATITLE_DESC="При автоматическом заполнении метаданных компонент может сам составить мета-заголовок для каждой пройденной страницы, если его нет. Такой заголовок берётся из текста страницы по селектору CSS, указанному в параметре ниже. В режиме переопределения найденный на странице мета-заголовок заменяется составленным"
COM_JMAP_METAINFO_AUTO_GENERATE_METATITLE_CSS_SELECTOR="Селектор CSS для мета-заголовка"
COM_JMAP_METAINFO_AUTO_GENERATE_METATITLE_CSS_SELECTOR_DESC="Можно указать селектор CSS, по которому на странице отыскиваются элементы с текстом для мета-заголовка. Несколько селекторов перечисляются через запятую"
COM_JMAP_METAINFO_AUTO_GENERATE_METATITLE_MAX_LENGTH="Максимальная длина мета-заголовка"
COM_JMAP_METAINFO_AUTO_GENERATE_METATITLE_MAX_LENGTH_DESC="Укажите наибольшее число символов для составляемого мета-заголовка. Он не должен превышать 60 символов; лишний текст обрезается автоматически"
COM_JMAP_METAINFO_AUTO_GENERATE_METATITLE_OVERRIDE="Да, заменять имеющийся заголовок"

COM_JMAP_METAINFO_AUTO_GENERATE_METADESCRIPTION="Создавать мета-описание самостоятельно"
COM_JMAP_METAINFO_AUTO_GENERATE_METADESCRIPTION_DESC="При автоматическом заполнении метаданных компонент может сам составить мета-описание для каждой пройденной страницы, если его нет. Такое описание берётся из текста страницы по селектору CSS, указанному в параметре ниже. В режиме переопределения найденное на странице мета-описание заменяется составленным"
COM_JMAP_METAINFO_AUTO_GENERATE_METADESCRIPTION_CSS_SELECTOR="Селектор CSS для мета-описания"
COM_JMAP_METAINFO_AUTO_GENERATE_METADESCRIPTION_CSS_SELECTOR_DESC="Можно указать селектор CSS, по которому на странице отыскиваются элементы с текстом для мета-описания. Несколько селекторов перечисляются через запятую"
COM_JMAP_METAINFO_AUTO_GENERATE_METADESCRIPTION_MAX_LENGTH="Максимальная длина мета-описания"
COM_JMAP_METAINFO_AUTO_GENERATE_METADESCRIPTION_MAX_LENGTH_DESC="Укажите наибольшее число символов для составляемого мета-описания. Оно не должно превышать 160 символов; лишний текст обрезается автоматически"
COM_JMAP_METAINFO_AUTO_GENERATE_METADESCRIPTION_OVERRIDE="Да, заменять имеющееся описание"

COM_JMAP_AUTOPOPULATE_METAINFO_DASHBOARD="Автозаполнение панели метаданных для новых материалов"
COM_JMAP_AUTOPOPULATE_METAINFO_DASHBOARD_DESC="Автоматически создаёт запись в панели метаданных при каждом создании нового материала с действующим адресом. В запись попадают заголовок материала, мета-описание, если оно есть (иначе — отрывок текста), и изображение полного текста или вступительное. Для работы нужны включённые параметры «Автоуведомление Ping-O-Matic и IndexNow» и «Уведомление по ссылке материала»"

COM_JMAP_AUTOPOPULATE_METAINFO_DASHBOARD_EXISTING="Автозаполнение панели метаданных для имеющихся материалов"
COM_JMAP_AUTOPOPULATE_METAINFO_DASHBOARD_EXISTING_DESC="Автоматически создаёт записи в панели метаданных для всех имеющихся материалов с действующими адресами, у которых записи ещё нет. В записи попадают заголовок материала, мета-описание, если оно есть (иначе — отрывок текста), и изображение полного текста или вступительное. Для работы нужны включённые параметры «Автоуведомление Ping-O-Matic и IndexNow» и «Уведомление по ссылке материала»"

COM_JMAP_METAINFO_URLDECODE="Декодировать адреса метаданных"
COM_JMAP_METAINFO_URLDECODE_DESC="Если параметр включён, в адресах, разбираемых для метаданных, убирается процентное кодирование — например, пробелы, записанные как %20. Если какой-то компонент использует адреса с процентным кодированием и метаданные пропадают, параметр можно отключить"

COM_JMAP_METAINFO_ENABLE_CHATGPT_GENERATION="Создание через ChatGPT"
COM_JMAP_METAINFO_ENABLE_CHATGPT_GENERATION_DESC="Мета-заголовок и мета-описание можно создавать через ChatGPT. При включённом параметре над каждым полем метаданных появляется кнопка ChatGPT: он составит и заголовок, и описание для каждой страницы. Нужен действующий ключ API ChatGPT"

COM_JMAP_METAINFO_ENABLE_GEMINI_GENERATION="Создание через Gemini"
COM_JMAP_METAINFO_ENABLE_GEMINI_GENERATION_DESC="Мета-заголовок и мета-описание можно создавать через Google Gemini. При включённом параметре над каждым полем метаданных появляется кнопка Gemini: он составит и заголовок, и описание для каждой страницы. Нужен действующий ключ API Gemini"

COM_JMAP_METAINFO_URLENCODE_SPACE="Кодировать пробелы в адресах"
COM_JMAP_METAINFO_URLENCODE_SPACE_DESC="Если параметр включён, пробелы в адресах, разбираемых для метаданных, кодируются как %20. Это требуется, например, для адресов, которые создают теги K2"

COM_JMAP_METAINFO_REMOVE_TRAILING_SLASH="Сверять адреса без завершающей косой черты"
COM_JMAP_METAINFO_REMOVE_TRAILING_SLASH_DESC="Если параметр включён, при сверке адресов завершающая косая черта не учитывается. Это пригодится, например, если вы убрали её из адресов сайта или установили стороннее ЧПУ-расширение, которое работает с адресами без неё"

COM_JMAP_METAINFO_ADD_TRAILING_SLASH="Сверять адреса с завершающей косой чертой"
COM_JMAP_METAINFO_ADD_TRAILING_SLASH_DESC="Если параметр включён, при сверке адресов добавляется завершающая косая черта. Это пригодится, например, если вы добавили её к адресам сайта или установили стороннее ЧПУ-расширение, которое работает с адресами с ней"

COM_JMAP_METAINFO_OGTAGS="Теги Open Graph для метаданных"
COM_JMAP_METAINFO_OGTAGS_DESC="Если параметр включён, для каждой заполненной ссылки в панели метаданных на страницу добавляются и теги Open Graph"

COM_JMAP_METAINFO_TWITTERCARD="Карточки Twitter для метаданных"
COM_JMAP_METAINFO_TWITTERCARD_DESC="Если параметр включён, при работе панели метаданных добавляются дополнительные мета-теги карточек Twitter. Для этого должны быть включены и теги Open Graph"

COM_JMAP_METAINFO_TWITTERCARD_SITE="Имя пользователя сайта для карточек Twitter"
COM_JMAP_METAINFO_TWITTERCARD_SITE_DESC="Укажите своё имя пользователя в формате Twitter, как оно записано в вашей учётной записи: @username"

COM_JMAP_METAINFO_TWITTERCARD_CREATOR="Имя пользователя автора для карточек Twitter"
COM_JMAP_METAINFO_TWITTERCARD_CREATOR_DESC="Укажите своё имя пользователя в формате Twitter, как оно записано в вашей учётной записи и используется в качестве автора содержимого: @username"

COM_JMAP_METAINFO_TWITTERCARD_SUMMARY_LARGE_IMAGE="Карточки Twitter с крупным изображением"
COM_JMAP_METAINFO_TWITTERCARD_SUMMARY_LARGE_IMAGE_DESC="Включает автоматическое добавление мета-тегов карточек Twitter типа «summary_large_image». В таких карточках изображение показывается крупно. Если параметр выключен, используется обычный тип «summary» с небольшим квадратным эскизом"

COM_JMAP_AUTOPOPULATE_SOCIALIMAGE_SELECTOR="Селектор CSS для изображения соцсетей"
COM_JMAP_AUTOPOPULATE_SOCIALIMAGE_SELECTOR_DESC="Можно указать селектор CSS, по которому на странице отыскивается изображение: оно автоматически попадёт в поле изображения для соцсетей при автоматическом заполнении метаданных. Несколько селекторов перечисляются через запятую"

COM_JMAP_METAINFO_OGTAGS_ADDITIONAL="Дополнительные теги Open Graph"
COM_JMAP_METAINFO_OGTAGS_ADDITIONAL_DESC="Включает автоматическое добавление дополнительных мета-тегов Open Graph: og:site_name (название сайта) и og:locale (язык текущей страницы)"

COM_JMAP_ROBOTS_JOOMLA_SUBFOLDER="Robots.txt в корне сервера"
COM_JMAP_ROBOTS_JOOMLA_SUBFOLDER_DESC="Если Joomla! установлена в подпапку, а файл robots.txt перенесён из папки Joomla! в корень сервера, включите этот параметр, чтобы JSitemap нашёл и смог изменить файл в корне"

COM_JMAP_INDEXING_TESTER_CUSTOM_SELECTOR_LINK="Селектор CSS для ссылок при проверке индексирования"
COM_JMAP_INDEXING_TESTER_CUSTOM_SELECTOR_LINK_DESC="Если при проверке индексирования в Google не выводятся, например, ссылки, можно указать свой селектор CSS под изменившуюся выдачу Google"

COM_JMAP_INDEXING_TESTER_CUSTOM_SELECTOR_TITLE="Селектор CSS для заголовков при проверке индексирования"
COM_JMAP_INDEXING_TESTER_CUSTOM_SELECTOR_TITLE_DESC="Если при проверке индексирования в Google не выводятся, например, заголовки, можно указать свой селектор CSS под изменившуюся выдачу Google"

COM_JMAP_INDEXING_TESTER_CUSTOM_SELECTOR_DESCRIPTION="Селектор CSS для описаний при проверке индексирования"
COM_JMAP_INDEXING_TESTER_CUSTOM_SELECTOR_DESCRIPTION_DESC="Если при проверке индексирования в Google не выводятся, например, описания, можно указать свой селектор CSS под изменившуюся выдачу Google"

COM_JMAP_DISABLE_VERSION_CHECKER="Отключить проверку обновлений"
COM_JMAP_DISABLE_VERSION_CHECKER_DESC="Если при открытии главной панели управления возникают задержки или ошибка PHP из-за того, что сервер не поддерживает внешние соединения, проверку обновлений можно отключить"

COM_JMAP_LINKABLE_CATS="Делать категории ссылками"
COM_JMAP_LINKABLE_CATS_DESC="При значении «Да», если дерево элементов сгруппировано по папкам категорий, название папки будет вести на соответствующую категорию. Для этого в карте сайта должен быть включён источник данных для категорий, из которого строится их дерево. При значении «Да, скрыть дерево категорий» дерево категорий в карте не показывается и используется только для получения ссылок на категории. На шаблон Mindmap SCK этот параметр не влияет"
COM_JMAP_YES_HIDE="Да, скрыть дерево категорий"

COM_JMAP_MERGE_MENU_TREE="Объединять с деревом меню"
COM_JMAP_MERGE_MENU_TREE_DESC="Если параметр включён и дерево элементов сгруппировано по категориям, на которые ведут пункты меню, элементы источника будут объединены с деревом меню. Для этого в карте сайта должны быть включены источники и для категорий, и для элементов, а источник меню должен содержать пункты, связанные с отдельными категориями. При значении «Да, скрыть дерево категорий» деревья категорий и элементов в карте не показываются и используются только для объединения с деревом меню. На шаблон Mindmap SCK этот параметр не влияет"

COM_JMAP_MERGE_MENU_TREE_LEVELS="Уровень объединения категорий"
COM_JMAP_MERGE_MENU_TREE_LEVELS_DESC="По умолчанию с деревом меню объединяются ТОЛЬКО категории ВЕРХНЕГО УРОВНЯ, связанные с пунктами меню. Если на отдельные пункты меню у вас выведены вложенные категории, переключите режим на «Дочерний уровень», чтобы объединялись и они"
COM_JMAP_MERGE_TOPLEVEL="Верхний уровень"
COM_JMAP_MERGE_CHILDLEVEL="Дочерний уровень"
COM_JMAP_MERGE_TOPCHILDLEVEL="Верхний и дочерний уровень"

COM_JMAP_LINKABLE_CONTENT_CATS="Делать категории ссылками"
COM_JMAP_LINKABLE_CONTENT_CATS_DESC="При значении «Да» названия папок будут ссылками на соответствующие категории материалов. На шаблон Mindmap SCK этот параметр не влияет; ссылки на категории при этом попадают и в XML-карту сайта"

COM_JMAP_ENABLE_DEBUG="Отладка PHP"
COM_JMAP_ENABLE_DEBUG_DESC="Укажите, показывать ли ошибки PHP во время работы компонента"

;Google Analitics config
COM_JMAP_GOOGLE_ANALYTICS_SETTINGS="Google Search Console и Analytics"
COM_JMAP_GOOGLE_PREFERRED_DOMAIN="Основные домены сайта"
COM_JMAP_ANALYTICS_SERVICE="Сервис статистики"
COM_JMAP_ANALYTICS_SERVICE_DESC="Выберите сервис, у которого запрашивается статистика по вашему сайту: Google, Statscrop и другие. Учтите: в зависимости от выбранного сервиса может потребоваться учётная запись или подключённый к нему сайт, иначе получить данные не удастся"
COM_JMAP_ANALYTICS_SERVICE_GOOGLE="Google Analytics"
COM_JMAP_ANALYTICS_SERVICE_MATOMO="Matomo Analytics"
COM_JMAP_ANALYTICS_SERVICE_STATSCROP="Statscrop Analytics"
COM_JMAP_ANALYTICS_SERVICE_HYPESTAT="HypeStat Analytics"
COM_JMAP_ANALYTICS_SERVICE_SEARCHMETRICS="SearchMetrics Analytics"
COM_JMAP_ANALYTICS_API="Google Analytics API"
COM_JMAP_ANALYTICS_API_DESC="Выберите тип API для получения данных из Google Analytics. Для работы с ресурсом Google Analytics 4 выберите «Google Analytics Data API» и укажите идентификатор ресурса. Для прежней системы Universal Analytics выберите другой API и укажите адрес домена ниже"
COM_JMAP_ANALYTICS_API_ANALYTICS="Google Analytics API (UA — Universal Analytics, устаревший)"
COM_JMAP_ANALYTICS_API_REPORTING="Google Analytics Reporting API (UA — Universal Analytics, устаревший)"
COM_JMAP_ANALYTICS_API_DATA="Google Analytics Data API (GA4 — Google Analytics 4)"
COM_JMAP_GOOGLE_PROPERTY_ID="Идентификатор ресурса GA4"
COM_JMAP_GOOGLE_PROPERTY_ID_DESC="Введите идентификатор ресурса Google Analytics 4, указанный в настройках вашего ресурса"
COM_JMAP_MATOMO_ANALYTICS_URL="Адрес Matomo Analytics"
COM_JMAP_MATOMO_ANALYTICS_URL_DESC="Введите адрес Matomo, по которому идут обращения к API для панели статистики. Он не связан с настройками кода отслеживания"
COM_JMAP_MATOMO_ANALYTICS_IDSITE="Идентификатор сайта Matomo Analytics"
COM_JMAP_MATOMO_ANALYTICS_IDSITE_DESC="Введите идентификатор сайта Matomo, используемый при обращении к API для панели статистики. Он не связан с настройками кода отслеживания"
COM_JMAP_MATOMO_TOKEN_AUTH="Токен Matomo API (token_auth)"
COM_JMAP_MATOMO_TOKEN_AUTH_DESC="Введите токен token_auth для доступа к отчётам Matomo. У него должны быть права не ниже «просмотр» для выбранного сайта"
COM_JMAP_MATOMO_API_REQUEST_MODE="Режим запросов к Matomo API"
COM_JMAP_MATOMO_API_REQUEST_MODE_DESC="Выберите способ авторизации JSitemap в Matomo API. Для защищённых токенов используйте POST, в режиме AUTO сначала пробуется POST, затем GET, а GET подойдёт для старых настроек"
COM_JMAP_MATOMO_API_REQUEST_MODE_POST="POST (рекомендуется)"
COM_JMAP_MATOMO_API_REQUEST_MODE_AUTO="AUTO (POST, затем GET)"
COM_JMAP_MATOMO_API_REQUEST_MODE_GET="GET (устаревший)"
COM_JMAP_GOOGLE_APP_CREDENTIALS="Данные приложения Google"
COM_JMAP_GOOGLE_DOMAIN="Домен для сервиса статистики"
COM_JMAP_GOOGLE_DOMAIN_DESC="Можно указать домен сайта, статистика по которому берётся из Google Analytics. Если в учётной записи Google у вас больше одного сайта, будет использован указанный здесь — записывайте его точно так, как он задан в настройках Google Analytics, в формате «http://www.mydomain.com». Домен должен принадлежать учётной записи, под которой выполнен вход в панели управления. Если домен не указан, берётся домен текущего сайта"
COM_JMAP_GOOGLE_WMDOMAIN="Домен для Google Search Console"
COM_JMAP_GOOGLE_WMDOMAIN_DESC="Можно указать домен сайта для Google Search Console. Записывайте его точно так, как зарегистрирован ваш ресурс: при подтверждении способом «Префикс URL» — в формате «http://www.mydomain.com», при подтверждении способом «Домен (DNS)» — в формате «sc-domain:mydomain.com». Домен должен принадлежать учётной записи, под которой выполнен вход в панели управления. Если домен не указан, берётся домен текущего сайта, подтверждённый способом «Префикс URL»"
COM_JMAP_GOOGLE_PAGESPEEDDOMAIN="Домен для Google PageSpeed"
COM_JMAP_GOOGLE_PAGESPEEDDOMAIN_DESC="Можно указать домен сайта, который будет подставляться по умолчанию при проверке Google PageSpeed"
COM_JMAP_GA_NUM_RESULTS="Максимум результатов Google Analytics"
COM_JMAP_GA_NUM_RESULTS_DESC="Выберите наибольшее число результатов в статистике Google Analytics по источникам переходов, запросам и страницам"
COM_JMAP_GOOGLE_DOMAIN_MATCH_PROTOCOL="Учитывать протокол домена Google Analytics"
COM_JMAP_GOOGLE_DOMAIN_MATCH_PROTOCOL_DESC="Если в параметре выше задан свой домен Google Analytics, по умолчанию учитывается только сам домен, а протокол http или https не принимается во внимание. Включите этот параметр, чтобы домен сверялся ровно в том виде, в каком вы его ввели"
COM_JMAP_ANALYTICS_SERVICE_HTTP_TRANSPORT="Способ соединения PHP"
COM_JMAP_ANALYTICS_SERVICE_HTTP_TRANSPORT_DESC="Выберите способ соединения с внешним сервисом. По умолчанию используются сокеты PHP, но при ошибках можно переключиться на библиотеку PHP cURL"
COM_JMAP_ANALYTICS_SERVICE_HTTP_TRANSPORT_CURL="Библиотека cURL"
COM_JMAP_ANALYTICS_SERVICE_HTTP_TRANSPORT_SOCKET="Сокеты PHP"
COM_JMAP_GOOGLE_APIKEY="Ключ API Google"
COM_JMAP_GOOGLE_APIKEY_DESC="Укажите свой ключ API, если вы настроили собственное приложение Google для Google Search Console и Google Analytics"
COM_JMAP_GOOGLE_CLIENTID="Идентификатор клиента Google"
COM_JMAP_GOOGLE_CLIENTID_DESC="Укажите свой идентификатор клиента, если вы настроили собственное приложение Google для Google Search Console и Google Analytics"
COM_JMAP_GOOGLE_SECRET="Секретный код Google"
COM_JMAP_GOOGLE_SECRET_DESC="Укажите свой секретный код, если вы настроили собственное приложение Google для Google Search Console и Google Analytics"
COM_JMAP_GOOGLE_ANALYTICS_TRACKING_CODE="Код отслеживания Google Analytics"
COM_JMAP_INJECT_GAJS="Вставлять код Google Analytics"
COM_JMAP_INJECT_GAJS_DESC="Укажите, вставлять ли код отслеживания Google Analytics на страницы Joomla!. ВНИМАНИЕ: код отслеживания никак не связан с данными домена, по которым статистика запрашивается через интеграцию с Google Analytics"
COM_JMAP_GAJS_CODE="Код Google Analytics"
COM_JMAP_GAJS_CODE_DESC="Укажите идентификатор Google Analytics для вашего домена, например в формате G-J0XXXXXXXX или UA-31334312-0. Для ресурса Google Analytics 4 формат кода — G-J0XXXXXXXX, а версия кода всегда должна быть «Gtag»"
COM_JMAP_GAJS_CODE_HINT="Введите код в формате: G-J0XXXXXXXX"
COM_JMAP_INJECT_GAJS_LOCATION="Место вставки кода"
COM_JMAP_INJECT_GAJS_LOCATION_DESC="Выберите, куда вставлять код Google Analytics — в тег body или в тег head"
COM_JMAP_INJECT_GAJS_LOCATION_BODY="Тег body"
COM_JMAP_INJECT_GAJS_LOCATION_HEAD="Тег head"
COM_JMAP_INJECT_GAJS_VERSION="Версия кода"
COM_JMAP_INJECT_GAJS_VERSION_DESC="Выберите версию кода отслеживания Google Analytics — скрипт gtag.js или analytics.js"
COM_JMAP_INJECT_GAJS_VERSION_ANALYTICS="Analytics"
COM_JMAP_INJECT_GAJS_VERSION_GTAG="Gtag"
COM_JMAP_GAJS_ANONYMIZE="Скрывать IP-адрес"
COM_JMAP_GAJS_ANONYMIZE_DESC="Если на вас распространяется европейский регламент GDPR, при использовании Google Analytics может потребоваться скрывать IP-адреса посетителей"
COM_JMAP_GAJS_CODE_USE_ANALYTICS="Использовать код UA для Google Analytics API"
COM_JMAP_GAJS_CODE_USE_ANALYTICS_DESC="Если параметр включён, код UA из поля выше используется и для выбора нужного ресурса при обращении к Google Analytics API. У него наивысший приоритет, и он важнее способа по адресу из параметра «Домен для сервиса статистики». Учтите: на Google Analytics Data API (GA4 — Google Analytics 4) этот параметр не распространяется"
COM_JMAP_GTM_TRACKING_CODE="Код отслеживания Google Tag Manager"
COM_JMAP_GTMJS="Вставлять код Google Tag Manager"
