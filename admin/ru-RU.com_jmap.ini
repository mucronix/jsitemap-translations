COM_JMAP_SQLQUERY_CATIDNAME="Поле CATEGORY ID, если нужно для ссылки:"
COM_JMAP_SQLQUERY_CATIDNAME_DESC="Выберите поле таблицы с идентификатором категории, если выбранный компонент использует категории и они нужны для построения ссылки. <br/>Если указать конструкцию «AS», её значение станет именем параметра в строке запроса, иначе будет использовано имя поля. Обычно это «catid»"

COM_JMAP_SQLQUERY_VIEWNAME="Вид (VIEW) компонента, если нужен для ссылки:"
COM_JMAP_SQLQUERY_VIEWNAME_DESC="Укажите имя вида, если оно требуется компоненту для построения ссылки. Обычно оно совпадает с названием сущности: для компонента контактов это «contact», для веб-ссылок — «weblink» и так далее. Если не уверены, посмотрите на ссылки самого компонента"

