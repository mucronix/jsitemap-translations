COM_JMAP_SQLQUERY_ADDITIONAL_PARAMS_DESC="Можно указать дополнительные поля, которые будут добавлены в строку запроса ссылки. Перечисляйте их ПО ОДНОМУ В СТРОКЕ, например: FIELD1<br/>FIELD2<br/>FIELD3<br/> либо с конструкцией «AS», например:<br/> FIELD1 AS FIRSTFIELD<br/>FIELD2 AS SECONDFIELD<br/>FIELD3 AS THIRDFIELD. <br/>Если указана конструкция «AS», её значение станет именем параметра в строке запроса, иначе будет использовано имя поля."

