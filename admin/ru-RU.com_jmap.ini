; AI Indexing
COM_JMAP_AI_INDEXING="AI-индексирование"
COM_JMAP_AI_INDEXING_ENABLE_SCHEMA_MARKUP="Разметка Schema для AI-индексирования"
COM_JMAP_AI_INDEXING_ENABLE_SCHEMA_MARKUP_DESC="Включает разметку структурированных данных для ИИ-поисковиков, чтобы содержимое сайта лучше индексировалось и находилось. Разметка строится по записям раздела «Метаданные для поисковых систем и ИИ»"
COM_JMAP_AI_INDEXING_ENABLE_JSON_FEED="Лента JSON и файл llms.txt для AI-индексирования"
COM_JMAP_AI_INDEXING_ENABLE_JSON_FEED_DESC="Создаёт структурированную ленту JSON и записывает файл llms.txt в корень сайта, чтобы ИИ-поисковики лучше находили и индексировали содержимое. Данные берутся из записей раздела «Метаданные для поисковых систем и ИИ». Ссылка на ленту JSON доступна в главной панели SEO; её также можно добавить мета-тегом в исходный код страниц, чтобы ИИ-системы находили ленту сами. Чтобы создать и записать файл llms.txt в корень сайта, нажмите кнопку с карандашом в той же панели"
COM_JMAP_AI_INDEXING_INCLUDE_METATAG_JSON_FEED="Мета-тег со ссылкой на ленту JSON"
COM_JMAP_AI_INDEXING_INCLUDE_METATAG_JSON_FEED_DESC="Автоматически добавляет в исходный код страницы мета-тег со ссылкой на ленту JSON для AI-индексирования. Так ИИ-поисковики и внешние платформы смогут найти структурированную ленту содержимого"
COM_JMAP_AI_INDEXING_LINKSEF_METATAG_JSON_FEED="ЧПУ-адрес ленты JSON"
COM_JMAP_AI_INDEXING_LINKSEF_METATAG_JSON_FEED_DESC="Если параметр включён, в мета-теге, добавляемом в исходный код страницы, будет использован ЧПУ-адрес ленты JSON. Иначе в теге будет обычная ссылка на ленту"
COM_JMAP_AI_LLMS_GENERATION="СОЗДАНИЕ ФАЙЛА LLMS.TXT — нажмите здесь, чтобы создать и записать в корень сайта файл llms.txt по содержимому раздела «Метаданные для поисковых систем и ИИ»"
COM_JMAP_AI_LLMS_GENERATION_LATEST_DATE="Дата последнего создания файла llms.txt"
COM_JMAP_AI_INDEXING_WRITE_LLMS="Записать файл llms.txt в корень сайта"
COM_JMAP_AI_INDEXING_WRITING_LLMS="Идёт запись файла llms.txt в корень сайта, дождитесь завершения"
COM_JMAP_AI_INDEXING_WRITTEN_LLMS="Файл llms.txt %s записан."
COM_JMAP_AI_INDEXING_LLMS_URL="Файл llms.txt доступен по адресу: "
COM_JMAP_AI_INDEXING_LLMS_SITENAME="Название сайта для llms.txt"
COM_JMAP_AI_INDEXING_LLMS_SITENAME_DESC="Укажите название сайта для файла llms.txt. Если поле оставить пустым, будет использовано название сайта из общих настроек Joomla. Можно указать языковую константу Joomla (например, COM_MY_SITE_NAME) и задать её значение через переопределение языковых констант — это удобно для многоязычного сайта"
COM_JMAP_AI_INDEXING_LLMS_SITEDESCRIPTION="Описание сайта для llms.txt"
COM_JMAP_AI_INDEXING_LLMS_SITEDESCRIPTION_DESC="Укажите описание сайта для файла llms.txt. Если поле оставить пустым, будет использовано мета-описание из общих настроек Joomla. Можно указать языковую константу Joomla (например, COM_MY_SITE_DESCRIPTION) и задать её значение через переопределение языковых констант — это удобно для многоязычного сайта"
COM_JMAP_AI_FEED_MAX_ARTICLES="Максимум записей в ленте и llms.txt"
COM_JMAP_AI_FEED_MAX_ARTICLES_DESC="Наибольшее число записей, которые попадут в ленту JSON и в файл llms.txt. Записи идут в порядке добавления в панель метаданных (по убыванию ID), поэтому добавленные последними оказываются в начале ленты. Учтите: если заполнять панель старыми материалами после новых, у старых окажутся большие ID и они встанут первыми — выстраивайте работу с этим расчётом. Пустое поле — без ограничения. Параметр помогает удерживать размер файлов в пределах, удобных для языковых моделей"

;Markdown Pages for AI
COM_JMAP_MARKDOWN_PAGES="Markdown-страницы для ИИ-агентов"
COM_JMAP_MARKDOWN_PAGES_ENABLED="Markdown-страницы"
COM_JMAP_MARKDOWN_PAGES_ENABLED_DESC="Если параметр включён, каждая страница сайта доступна ещё и по своему адресу с окончанием .md (например, /my-article.md). ИИ-агенты и обходчики языковых моделей получают чистый текст в формате Markdown — без меню, скриптов и служебного оформления."
COM_JMAP_MARKDOWN_META_TAG="Мета-тег альтернативной версии"
COM_JMAP_MARKDOWN_META_TAG_DESC="Добавляет в &lt;head&gt; каждой страницы тег &lt;link rel=&quot;alternate&quot; type=&quot;text/markdown&quot;&gt;, чтобы ИИ-агенты сами находили её Markdown-версию."
COM_JMAP_MARKDOWN_ROBOTS_NOINDEX="Запрет индексирования .md"
COM_JMAP_MARKDOWN_ROBOTS_NOINDEX_DESC="Отдаёт заголовок X-Robots-Tag: noindex при каждом запросе к адресу с окончанием .md, чтобы поисковые системы не индексировали Markdown-версию как дубль страницы."
COM_JMAP_MARKDOWN_CONTENT_SELECTORS="Селекторы области содержимого"
COM_JMAP_MARKDOWN_CONTENT_SELECTORS_DESC="Селекторы XPath, по которым в готовой HTML-странице отыскивается основной блок содержимого, по одному в строке. Используется первый подходящий селектор. Дополните список селекторами своего шаблона или конструктора страниц (например, SP Page Builder, T4, Astroid). Селектор //body пробуется последним в любом случае, даже если его нет в списке."
COM_JMAP_MARKDOWN_EXCLUDE_OPTIONS="Исключить компоненты"
COM_JMAP_MARKDOWN_EXCLUDE_OPTIONS_DESC="Список компонентов Joomla через запятую, на страницы которых мета-тег альтернативной версии добавляться НЕ будет (например, com_contact,com_finder). Содержимое в формате Markdown по адресу с окончанием .md для этих компонентов по-прежнему будет доступно, пока вы не запретите доступ к нему на уровне сервера."
COM_JMAP_MARKDOWN_INCLUDE_FRONTMATTER="Заголовок YAML в начале файла"
COM_JMAP_MARKDOWN_INCLUDE_FRONTMATTER_DESC="Если параметр включён, в начало Markdown-страницы добавляется блок YAML со сведениями о странице (заголовок, описание, ключевые слова, адрес, дата). Отключите его, чтобы отдавать чистый Markdown без служебных данных."
COM_JMAP_MARKDOWN_RESPECT_IGNORE_ATTRIBUTE="Учитывать атрибут data-gsd-markdown-ignore"
COM_JMAP_MARKDOWN_RESPECT_IGNORE_ATTRIBUTE_DESC="Если параметр включён, элементы HTML с атрибутом data-gsd-markdown-ignore не попадут в Markdown-версию страницы. Так разработчик шаблона может исключить отдельные элементы, не меняя настройки JSitemap."

