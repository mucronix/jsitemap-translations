COM_JMAP_SQLQUERY_IDFIELD_DESC="Выберите поле таблицы с уникальным идентификатором элемента. <br/>Если указать конструкцию «AS», её значение станет именем параметра в строке запроса, иначе будет использовано имя поля. Обычно это «id»"
