COM_JMAP_CHOOSE_MENU="Фильтр по меню"
COM_JMAP_CHOOSE_MENU_DESC="Ссылки на карты сайта можно привязать к выбранному меню, чтобы ограничить содержимое карты определёнными источниками данных. При выборе значения в списке адреса автоматически обновляются и получают нужный параметр. После этого ссылки можно использовать или отправлять в поисковые системы. Фильтр по меню действует и на ссылки XML-карт. Это может быть полезно в сложных случаях: например, на сайтах с несколькими доменами, где у каждого домена своё меню и своя карта сайта, или при работе со сторонними расширениями, которые необходимо связать с языковыми меню, использующими разные источники данных."
