COM_JMAP_BLANK_WINDOW="В новом окне"
COM_JMAP_PARENT_WINDOW="В родительском окне"

COM_JMAP_DATASOURCE_LANGUAGE="Язык"
COM_JMAP_DATASOURCE_LANGUAGE_DESC="При необходимости выберите язык, к которому относится этот источник данных"
COM_JMAP_DATASOURCE_LANGUAGES_ALL="Все языки"

COM_JMAP_INCLUDE_EXTERNAL_LINKS="Включать внешние ссылки меню"
COM_JMAP_INCLUDE_EXTERNAL_LINKS_DESC="Укажите, включать ли в карту сайта внешние ссылки из пунктов меню"

COM_JMAP_MAXLEVELS="Глубина дерева"
COM_JMAP_MAXLEVELS_DESC="Задайте наибольшую глубину дерева карты сайта. По умолчанию дерево строится до 5-го уровня"

COM_JMAP_UNIQUE_PAGINATION="Убирать дубли постраничной навигации"
COM_JMAP_UNIQUE_PAGINATION_DESC="Если параметр включён, компонент сам исправляет повторяющиеся заголовки, которые Joomla создаёт для страниц с постраничной навигацией. Это улучшает SEO сайта"

COM_JMAP_ACTIONLOGS_INTEGRATION="Связь с журналом действий"
COM_JMAP_ACTIONLOGS_INTEGRATION_DESC="Включает запись действий в компонент Joomla «Журнал действий пользователей». Возможность поддерживается в Joomla 3.9 и новее"

COM_JMAP_DISABLE_SITEMAP_FORMATS="Отключение форматов карты сайта"
COM_JMAP_DISABLE_SITEMAP_FORMATS_DESC="Создание карт сайта в отдельных форматах можно отключить — например, чтобы закрыть доступ к карте изображений или видео"
COM_JMAP_DISABLED_SITEMAP_FORMATS="Отключённые форматы"
COM_JMAP_DISABLED_SITEMAP_FORMATS_DESC="Выберите форматы карт сайта, которые нужно отключить"
