COM_JMAP_GUESS_SEF_ITEMID="Автоподстановка алиаса пункта меню в ЧПУ-ссылки"
COM_JMAP_GUESS_SEF_ITEMID_DESC="Если ссылки этого источника имеют вид «component/com_componentname», а на сайте есть пункт меню, ведущий на это расширение, включите автоматическую маршрутизацию: часть ссылки «component/com_componentname» будет заменена алиасом из меню. Так ссылки в карте сайта совпадут с каноническими адресами расширения. Параметр не нужен, если ЧПУ-ссылками управляет стороннее расширение вроде sh404sef"

COM_JMAP_SEF_ITEMID="Выбор пункта меню для ЧПУ-ссылок вручную"
COM_JMAP_SEF_ITEMID_DESC="Если автоматический режим не поддерживается или не срабатывает, а ссылки этого источника имеют вид «component/com_componentname», укажите пункт меню явно: его алиас заменит часть ссылки «component/com_componentname». Если на расширение ведут несколько пунктов меню, может понадобиться несколько источников данных, повторяющих структуру меню, каждый со своим фильтром. Например, при нескольких пунктах меню на разные категории создайте по источнику на каждый и укажите нужный идентификатор категории в условии WHERE. Подробнее — в документации. Параметр не нужен, если ЧПУ-ссылками управляет стороннее расширение вроде sh404sef"

