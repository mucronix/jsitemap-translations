COM_JMAP_PAGEBROWSER_TITLE="Заголовок страницы в браузере"

COM_JMAP_COMPONENTTITLE="Свой главный заголовок"
COM_JMAP_COMPONENTTITLE_DESC="Введите свой заголовок для страницы карты сайта. Если поле пустое, используется название пункта меню Joomla"

COM_JMAP_HEADERLEVEL="Уровень главного заголовка"
COM_JMAP_HEADERLEVEL_DESC="Укажите уровень тега заголовка — h1, h2 и так далее — для главного заголовка карты сайта. Это важно для поисковых систем и SEO"

COM_JMAP_CLASSFORDIV="Класс контейнера карты сайта"
COM_JMAP_CLASSFORDIV_DESC="Укажите имя класса CSS для элемента div, в котором выводится дерево карты сайта. Учтите: этот класс будет перекрыт значением поля «Класс страницы» у пункта меню, если оно задано"

COM_JMAP_SHOW_CONTENT_PAGEBREAKS="Показывать ссылки на части материалов"
COM_JMAP_SHOW_CONTENT_PAGEBREAKS_DESC="При значении «Да» материалы, разбитые на страницы, попадут в карту сайта вместе со всеми своими частями"

COM_JMAP_INCLUDE_JQUERY="Подключать библиотеку jQuery"
COM_JMAP_INCLUDE_JQUERY_DESC="Подключение jQuery можно отключить — например, если библиотеку уже подключают другие расширения"

COM_JMAP_LOAD_ASYNC_SCRIPTS="Асинхронная загрузка скриптов"
COM_JMAP_LOAD_ASYNC_SCRIPTS_DESC="Если параметр включён, все скрипты на сайте загружаются асинхронно — это экономит канал и ускоряет страницу"

COM_JMAP_OPEN_TARGET="Как открывать ссылки"
COM_JMAP_OPEN_TARGET_DESC="Укажите, открывать ли ссылки карты сайта в новом окне"
