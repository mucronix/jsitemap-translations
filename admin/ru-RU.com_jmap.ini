COM_JMAP_DISABLED_SITEMAP_FORMATS_HREFLANG="Карта hreflang"
COM_JMAP_DISABLED_SITEMAP_FORMATS_RSS="RSS-лента"
COM_JMAP_SITEMAP_FORMAT="Формат карты сайта"
COM_JMAP_SITEMAP_FORMAT_DESC="Выберите формат карты сайта для этого пункта меню. По умолчанию создаётся обычная HTML-карта"

COM_JMAP_AUTO_UPDATER="Автоматическое обновление"
COM_JMAP_REGISTRATION_EMAIL_FORUPDATES="Адрес электронной почты для обновлений"
COM_JMAP_REGISTRATION_EMAIL_FORUPDATES_DESC="Введите тот же адрес электронной почты, на который зарегистрирована учётная запись на сайте https://storejextensions.org. По нему определяется ваша учётная запись и срок действия лицензии на обновления. Бесплатные обновления предоставляются в течение 1 года с даты последней покупки. Если лицензия действует, при выходе новой версии в панели управления появится кнопка обновления в один щелчок. Подробнее о лицензии и обновлениях — на странице вопросов и ответов https://storejextensions.org/faq.html"

COM_JMAP_SEARCHBOX="Расширенные сниппеты"
COM_JMAP_SEARCHBOX_ENABLE="Строка поиска по сайту в результатах поиска"
COM_JMAP_SEARCHBOX_ENABLE_DESC="Google может показывать строку поиска по вашему сайту прямо в результатах поиска. Эта возможность связывает её с выбранным поисковым компонентом Joomla. Подробнее — в документации Google: https://developers.google.com/search/docs/ data-types/sitelinks-searchbox"
COM_JMAP_SEARCHBOX_TYPE="Поисковый компонент"
COM_JMAP_SEARCHBOX_TYPE_DESC="Выберите компонент Joomla, который будет обрабатывать запросы из строки поиска Google"
COM_JMAP_SEARCHBOX_TYPE_SEARCH="Поиск Joomla!"
COM_JMAP_SEARCHBOX_TYPE_FINDER="Умный поиск Joomla!"
COM_JMAP_SEARCHBOX_TYPE_CUSTOM="Свой адрес поиска"
COM_JMAP_SEARCHBOX_CUSTOM="Свой адрес поиска"
COM_JMAP_SEARCHBOX_CUSTOM_DESC="Укажите свой адрес поиска для стороннего компонента. В адресе обязательно должен быть подстановочный знак {search_term}"
COM_JMAP_SEARCHBOX_URL="Домен сайта"
COM_JMAP_SEARCHBOX_URL_DESC="Укажите домен сайта. Если поле пустое, используется домен сайта по умолчанию"

COM_JMAP_OPTIN_CONTENTS="Согласие на показ содержимого"
COM_JMAP_OPTIN_CONTENTS_ENABLE="Разрешающее указание robots"
COM_JMAP_OPTIN_CONTENTS_ENABLE_DESC="Если ваш сайт работает в Европе, то после введения европейского закона об авторском праве, уже действующего во Франции, Google может перестать показывать ваши сниппеты и содержимое — пока вы не разрешите это мета-тегом robots. Указание ниже задаёт для текста, изображений и видео такое разрешение, и Google снова показывает сниппеты как прежде"
COM_JMAP_OPTIN_CONTENTS_ROBOTS_DIRECTIVE="Указание robots"
COM_JMAP_OPTIN_CONTENTS_ROBOTS_DIRECTIVE_DESC="Вы можете задать, как Google показывает фрагменты вашего сайта. Запись «max-snippet:[число]» ограничивает длину текста, «max-video-preview:[число]» — длительность показа видео в секундах, «max-image-preview:[значение]» — размер изображения: «none», «standard» или «large». Значение «-1» снимает ограничение, и сниппет формируется как обычно"

COM_JMAP_CUSTOM_404_PAGE="Страница 404"
COM_JMAP_CUSTOM_404_STATUS="Своё содержимое страницы 404"
COM_JMAP_CUSTOM_404_STATUS_DESC="Включает или выключает своё содержимое на странице 404"
COM_JMAP_CUSTOM_404_OVERRIDE="Режим переопределения страницы 404"
COM_JMAP_CUSTOM_404_OVERRIDE_DESC="Если своё содержимое страницы 404 не появляется, её, скорее всего, формируют другие плагины или шаблон. В этом случае включите режим переопределения, чтобы приоритет получил вариант JSitemap"
COM_JMAP_CUSTOM_404_MODE="Тип своего содержимого"
COM_JMAP_CUSTOM_404_MODE_DESC="Выберите тип своего содержимого страницы 404 — простой текст или HTML. Если файл страницы ошибки в вашем шаблоне не выводит HTML, выберите текст"
COM_JMAP_CUSTOM_404_MODE_TEXT="Текст"
COM_JMAP_CUSTOM_404_MODE_HTML="HTML"
COM_JMAP_CUSTOM_404_PROCESS_CONTENT_PLUGINS="Обрабатывать плагинами содержимого"
COM_JMAP_CUSTOM_404_PROCESS_CONTENT_PLUGINS_DESC="Если параметр включён, своё содержимое страницы 404 будет обработано плагинами Joomla группы «content». Перед включением убедитесь, что выбран тип содержимого HTML и что ваш шаблон выводит HTML на странице 404"
COM_JMAP_CUSTOM_404_TEXT="Своё содержимое"
COM_JMAP_CUSTOM_404_TEXT_DESC="Укажите содержимое — текст или HTML, — которое будет показано на вашей странице 404"

COM_JMAP_SPLIT_SITEMAP="Разбивать карту сайта"
COM_JMAP_SPLIT_SITEMAP_DESC="Если включить разбиение, то при экспорте XML-карты сайта со слишком большим для поисковых систем числом ссылок она будет разделена на несколько файлов по заданному пределу. Сейчас поисковые системы допускают до 50000 ссылок в одном файле карты сайта"

COM_JMAP_SPLITCHUNKS="Максимум ссылок в файле"
COM_JMAP_SPLITCHUNKS_DESC="Выберите предел числа ссылок, по которому карта сайта при экспорте будет разделена на несколько файлов"

COM_JMAP_SPLIT_ROOTNODE="Корневой узел при разбиении"
COM_JMAP_SPLIT_ROOTNODE_DESC="На некоторых серверах и версиях PHP разделённые файлы могут получаться недействительными. Если при проверке таких файлов возникают ошибки, измените этот параметр, чтобы переключить определение пространства имён XML"

