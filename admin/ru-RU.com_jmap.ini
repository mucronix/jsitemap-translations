COM_JMAP_CATS_PRIORITIES="Приоритеты материалов по категориям"
COM_JMAP_ASSIGN_MENU_PRIORITIES="Назначение приоритета пункту меню"
COM_JMAP_ASSIGN_MENU_PRIORITIES_DESC="Общий приоритет этого источника можно переопределить для каждого пункта меню. Чтобы назначить приоритет, выберите пункт меню в левом списке, значение — в правом и нажмите «Назначить». Чтобы снять назначенный приоритет, выберите пункт меню в левом списке и нажмите «Убрать»."
COM_JMAP_ASSIGN_CATS_PRIORITIES="Назначение приоритета категории"
COM_JMAP_ASSIGN_CATS_PRIORITIES_DESC="Общий приоритет можно переопределить для отдельной категории материалов. Чтобы назначить приоритет, выберите категорию в левом списке, значение — в правом и нажмите «Назначить». Чтобы снять назначенный приоритет, выберите категорию в левом списке и нажмите «Убрать»."
