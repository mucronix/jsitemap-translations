; Google PageSpeed
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY="Итоги проверки"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_PAGE_LINK="Ссылка на страницу:"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TEST_LINK="Проверить ссылку"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCREENSHOT="Снимок страницы"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE="Оценка"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE_VOTE="Категория оценки"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE_DESC="Это абсолютная оценка PageSpeed для этой страницы, рассчитанная для компьютеров"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE_VOTE_DESC="Категория определяется по абсолютной оценке. Их три: 0–49 — МЕДЛЕННО, 50–89 — СРЕДНЕ, 90–100 — БЫСТРО"
COM_JMAP_GOOGLE_PAGESPEED_PERFORMANCE_REPORT="Производительность"
COM_JMAP_GOOGLE_PAGESPEED_SEO_REPORT="SEO"
COM_JMAP_GOOGLE_PAGESPEED_OVERVIEW_REPORT="Обзор"
COM_JMAP_GOOGLE_PAGESPEED_PERFORMANCE_REPORT_WEBVITALS="Этот показатель входит в Core Web Vitals"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_AVERAGE_FCP="Средний показатель First Contentful Paint (FCP)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_AVERAGE_FCP_DESC="First Contentful Paint (FCP) — время от начала загрузки страницы до момента, когда браузер отображает первый фрагмент содержимого. Здесь показано среднее значение за последние 30 дней"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LCP="Largest Contentful Paint (LCP)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LCP_DESC="Показатель Largest Contentful Paint (LCP) — время отрисовки крупнейшего элемента контента, видимого в области просмотра, считая от начала загрузки страницы. Для хорошего пользовательского опыта LCP должен укладываться в 2,5 секунды с начала загрузки"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_CLS="Cumulative Layout Shift (CLS)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_CLS_DESC="CLS — наибольшая серия совокупных смещений макета за всё время жизни страницы. Смещение происходит каждый раз, когда видимый элемент меняет своё положение между соседними кадрами отрисовки. Для хорошего пользовательского опыта значение CLS должно быть не больше 0,1"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FID="First Input Delay (FID)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FID_DESC="First Input Delay (FID) — время от первого действия пользователя на сайте (нажатия на ссылку или кнопку, работы с элементом на JavaScript) до момента, когда браузер действительно смог на это действие ответить. Для хорошего пользовательского опыта значение FID должно быть не больше 100 миллисекунд"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SPEED_INDEX="Индекс скорости"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SPEED_INDEX_DESC="Индекс скорости показывает, насколько быстро содержимое страницы становится видимым"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FCP="Абсолютный показатель First Contentful Paint (FCP)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FCP_DESC="First Contentful Paint (FCP) — время от начала загрузки страницы до момента, когда браузер отображает первый фрагмент содержимого. Здесь показано абсолютное значение, полученное при текущей проверке этой ссылки"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FMP="Смещения макета"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FMP_DESC="Неожиданные смещения макета мешают работе со страницей: из-за внезапно сдвинувшегося текста легко потерять место при чтении или нажать не ту ссылку или кнопку"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FCI="Время ответа сервера"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FCI_DESC="Медленный ответ сервера снижает производительность: время ответа на основной запрос документа не должно превышать 600 мс"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TTI="Время до интерактивности"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TTI_DESC="Время, за которое страница становится полностью готовой к работе"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_INP="Interaction to Next Paint (INP)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_INP_DESC="INP оценивает быстроту отклика страницы на действия пользователя: учитывается задержка всех нажатий, касаний и действий с клавиатурой за время посещения страницы. Итоговым значением INP становится самое долгое взаимодействие, без учёта единичных выбросов"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_JSEXEC="Время выполнения JavaScript"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_JSEXEC_DESC="Стоит сократить время на разбор, компиляцию и выполнение JavaScript. Обычно помогает уменьшение объёма отдаваемых скриптов"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_AUDIT_TEST_TITLE="Проверка"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_AUDIT_TEST_STATUS="Результат"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_RENDER_BLOCKING_INSIGHT="Устраните ресурсы, блокирующие отрисовку"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_RENDER_BLOCKING_INSIGHT_DESC="Эти запросы блокируют первую отрисовку страницы и могут задерживать LCP. Критически важные JS и CSS стоит встроить прямо в страницу, а остальные — отложить, убрав их с критического пути"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_IMAGE_DELIVERY_INSIGHT="Ускорьте отдачу изображений"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_IMAGE_DELIVERY_INSIGHT_DESC="Чем быстрее загружаются изображения, тем быстрее страница кажется готовой и тем лучше показатель LCP"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_NETWORK_SERVER_LATENCY="Задержки на стороне сервера"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_NETWORK_SERVER_LATENCY_DESC="Задержки сервера влияют на скорость сайта. Высокая задержка говорит о том, что сервер перегружен или работает недостаточно быстро"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_VIEWPORT_INSIGHT="Настройте область просмотра для мобильных"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_VIEWPORT_INSIGHT_DESC="Если область просмотра не настроена под мобильные устройства, отклик на касание может задерживаться до 300 мс"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_UNMINIFIED_CSS="Минимизируйте CSS"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_UNMINIFIED_CSS_DESC="Минимизация файлов CSS уменьшает объём передаваемых данных"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_UNMINIFIED_JAVASCRIPT="Минимизируйте JavaScript"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_UNMINIFIED_JAVASCRIPT_DESC="Минимизация файлов JavaScript уменьшает объём данных и время разбора скриптов"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_REDIRECTS="Избегайте цепочек перенаправлений"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_REDIRECTS_DESC="Каждое перенаправление добавляет задержку перед загрузкой страницы"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TTFB="Time To First Byte"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TTFB_DESC="TTFB — время между запросом ресурса и получением первого байта ответа"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_MAX_POTENTIAL_FID="Наибольшая возможная задержка First Input Delay"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_MAX_POTENTIAL_FID_DESC="Наибольшая задержка первого действия, с которой могут столкнуться посетители, равна длительности самой долгой задачи в миллисекундах"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_MAIN_THREAD_TASKS="Задачи"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_MAIN_THREAD_TASKS_DESC="Список задач верхнего уровня, выполненных в основном потоке во время загрузки страницы."
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LONG_TASKS="Избегайте долгих задач в основном потоке"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LONG_TASKS_DESC="Список самых долгих задач в основном потоке — по нему удобно находить главные причины задержки отклика. [Как избегать долгих задач в основном потоке](https://web.dev/articles/optimize-long-tasks)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_BOOTUP_TIME="Время выполнения JavaScript"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_BOOTUP_TIME_DESC="Стоит сократить время на разбор, компиляцию и выполнение JavaScript. Обычно помогает уменьшение объёма отдаваемых скриптов. [Как сократить время выполнения JavaScript](https://developer.chrome.com/docs/lighthouse/performance/bootup-time/)."
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TBT="Общее время блокировки"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TBT_DESC="Сумма всех промежутков между FCP и временем до интерактивности, в которых задача длилась дольше 50 мс, в миллисекундах"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TOTAL_BYTE_WEIGHT="Избегайте слишком тяжёлых страниц"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_TOTAL_BYTE_WEIGHT_DESC="Большой объём передаваемых данных обходится посетителям в реальные деньги и, как правило, означает долгую загрузку"
COM_JMAP_GOOGLE_PAGESPEED_ASSETS_REPORT="Ресурсы страницы"
