COM_JMAP_APPEND_LANG_PARAM="Ссылки на XML-карты поддерживают несколько языков. Если сайт многоязычный — на штатной системе Joomla! или на стороннем расширении — выберите язык в списке, и адрес обновится автоматически с нужным параметром языка. Список языков появляется только при правильно включённых системных плагинах многоязычности. При выборе значения в списке обновляются и ссылки с фильтрами по наборам источников или по меню, если они заданы."
COM_JMAP_XML_MOBILE_DISCLAIMER="XML-карту мобильной версии следует использовать, ТОЛЬКО если у сайта есть отдельная мобильная версия, разработанная специально для телефонов и отдающая мобильное содержимое."
COM_JMAP_XML_HREFLANG_DISCLAIMER="XML-карта hreflang сообщает поисковым системам об альтернативных языковых версиях страниц. Она строится по материалам и пунктам меню Joomla и требует, чтобы связи между ними были настроены в параметрах Joomla."
COM_JMAP_XML_GEOSITEMAP_DISCLAIMER="Карта Geo помогает Google и другим поисковым системам связать сайт с определённым местоположением и улучшить ранжирование. Укажите в настройках компонента действительный адрес."
COM_JMAP_XML_AMP_DISCLAIMER="Карту Google AMP следует отправлять, ТОЛЬКО если у сайта есть рабочая AMP-версия и AMP-страницы, созданные, например, расширением JAmp."
COM_JMAP_AI_JSON_FEED_LINK_DISCLAIMER="По этой ссылке доступна лента AI JSON Feed. Она создаётся автоматически по записям раздела «Метаданные для поисковых систем и ИИ» и помогает ИИ-поисковикам находить и индексировать содержимое сайта. Ссылка на ленту также добавляется в исходный код страниц мета-тегом. Её можно передать сторонним ИИ-платформам, агрегаторам содержимого и SEO-сервисам, которые работают со структурированными данными."
