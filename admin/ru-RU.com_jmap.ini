COM_JMAP_GOOGLE_PAGESPEED_REPORT_ASSET_THIRDPARTY="Сторонний"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SEO_TEST_TITLE="Проверка SEO"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SEO_TEST_STATUS="Результат"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_DOCUMENT_TITLE="На странице есть элемент &lt;title&gt;"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_DOCUMENT_TITLE_DESC="По заголовку пользователи программ чтения с экрана понимают, о чём страница, а посетители из поиска во многом по нему решают, подходит ли она их запросу"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_META_DESCRIPTION="Мета-описание страницы"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_META_DESCRIPTION_DESC="Мета-описание может попасть в результаты поиска как краткое изложение содержимого страницы"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_DOCUMENT_LATENCY_INSIGHT="Задержка запроса документа"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_DOCUMENT_LATENCY_INSIGHT_DESC="Первый сетевой запрос — самый важный. Сократите его задержку: избегайте перенаправлений, обеспечьте быстрый ответ сервера и включите сжатие текста"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_CANONICAL="На странице есть действительный «rel=canonical»"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_CANONICAL_DESC="Canonical подсказывает, какой адрес показывать в результатах поиска"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_HREFLANG="На странице есть действительный «hreflang»"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_HREFLANG_DESC="Ссылки hreflang сообщают поисковым системам, какую версию страницы показывать для того или иного языка или региона"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_ISCRAWABLE="Индексирование страницы не запрещено"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_ISCRAWABLE_DESC="Поисковые системы не смогут включить страницы в результаты поиска, если им запрещён обход"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LCP_DISCOVERY_INSIGHT="Обнаружение ресурса LCP"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LCP_DISCOVERY_INSIGHT_DESC="Чтобы улучшить LCP, сделайте изображение LCP видимым прямо в коде HTML и не применяйте к нему отложенную загрузку"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_CRAWABLEANCHORS="Ссылки доступны для обхода"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_CRAWABLEANCHORS_DESC="Поисковые системы обходят сайты по атрибутам «href». Следите, чтобы этот атрибут у ссылок вёл на нужный адрес, — так будет найдено больше страниц сайта"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_UNUSED_CSS_RULES="Удалите неиспользуемый CSS"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_UNUSED_CSS_RULES_DESC="Удалите из таблиц стилей неиспользуемые правила, а стили, не нужные для видимой части страницы, загружайте отложенно — это уменьшит объём передаваемых данных"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_STRUCTURED_DATA="Структурированные данные"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_STRUCTURED_DATA_DESC="Проверьте структурированные данные через [Structured Data Testing Tool](https://search.google.com/structured-data/testing-tool/) и [Structured Data Linter](http://linter.structured-data.org/)"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_ROBOTSTXT="Файл robots.txt"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_ROBOTSTXT_DESC="Если файл robots.txt составлен с ошибками, обходчики могут не понять, как вы хотите, чтобы сайт обходили и индексировали"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LINKTEXT="У ссылок есть понятный текст"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_LINKTEXT_DESC="По тексту ссылки поисковые системы лучше понимают содержимое сайта"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_HTTP_STATUS_CODE="Код ответа HTTP"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_HTTP_STATUS_CODE_DESC="Страницы с ошибочными кодами ответа HTTP могут быть проиндексированы неправильно"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_IMAGEALT="У изображений есть атрибут «alt»"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_IMAGEALT_DESC="Информативным изображениям нужен короткий и понятный замещающий текст. Для декоративных достаточно пустого атрибута alt"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE_SLOW="МЕДЛЕННО"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE_AVERAGE="СРЕДНЕ"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE_FAST="БЫСТРО"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUMMARY_SCORE_NONE="Н/Д"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_SUCCESS_DESC="Проверка пройдена"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_FAILURE_DESC="Проверка не пройдена"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_NOTAVAILABLE_DESC="Результат проверки недоступен"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_ERROR_RETRIEVING_STATS="Ошибка при получении отчёта PageSpeed и подключении к внешнему сервису: код HTTP %s <br/> Убедитесь, что указана действительная и доступная ссылка на страницу и что сервер может установить соединение с сервером Google. Если вы настроили собственное приложение Google и ключ API, проверьте, что для него включён PageSpeed Insights API"
COM_JMAP_GOOGLE_PAGESPEED_REPORT_STRATEGY="Проверку PageSpeed можно выполнять для компьютеров или для мобильных устройств. Это задаётся параметром анализатора ссылок «Тип анализа Google Pagespeed»"
