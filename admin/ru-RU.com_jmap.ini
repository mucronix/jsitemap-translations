COM_JMAP_SHOW_SOURCE_TITLE_DESC="Заголовок источника можно не показывать. В этом случае в дереве карты сайта останется только значок папки"

COM_JMAP_ENABLE_SEF_LINKS_REPLACEMENTS="Замены в ЧПУ-ссылках"
COM_JMAP_ENABLE_SEF_LINKS_REPLACEMENTS_DESC="В готовых ЧПУ-адресах можно заменять отдельные части. Например, в адресе http://www.mydomain.com/item/1-myproduct.html часть «item» можно заменить на «product» и получить http://www.mydomain.com/product/1-myproduct.html"

COM_JMAP_SEF_LINKS_REPLACEMENTS_SOURCE="Что заменять"
COM_JMAP_SEF_LINKS_REPLACEMENTS_SOURCE_DESC="Укажите через запятую одну или несколько заменяемых строк"

COM_JMAP_SEF_LINKS_REPLACEMENTS_TARGET="Чем заменять"
COM_JMAP_SEF_LINKS_REPLACEMENTS_TARGET_DESC="Укажите через запятую одну или несколько строк для замены. При нескольких значениях порядок должен совпадать с порядком в предыдущем поле"

COM_JMAP_DEBUG_MODE="Режим отладки"
COM_JMAP_DEBUG_MODE_DESC="В режиме отладки подробности ошибок SQL будут видны на сайте. Это помогает найти ошибку в синтаксисе запроса"

COM_JMAP_DOUPUBLISHED="Показывать неопубликованные элементы"
COM_JMAP_DOUPUBLISHED_DESC="При значении «Да» в карту сайта попадут и неопубликованные пункты меню. Это удобно, когда нужны ссылки, которых нет в меню сайта, но которые должны быть в карте сайта."

COM_JMAP_ENTER_ADDITIONAL_QUERYSTRING_PARAMS="Дополнительные параметры строки запроса"
COM_JMAP_ENTER_ADDITIONAL_QUERYSTRING_PARAMS_DESC="Можно задать дополнительные параметры, которые будут добавлены в строку запроса создаваемых ссылок. Например, для нестандартного или устаревшего компонента, работающего через task вместо view, укажите «task=mycomponenttask». Несколько параметров перечисляются через запятую: «task=mycomponenttask,key=xxx,key2=yyy»"

COM_JMAP_XMLSITEMAP_PARAMETERS="Параметры XML-карты сайта"
COM_JMAP_SELECTPRIORITY="Выберите приоритет"
COM_JMAP_SELECTCHANGEFREQ="Выберите частоту изменения"

COM_JMAP_ELEMENTS_PRIORITY="Приоритет элементов"
COM_JMAP_ELEMENTS_PRIORITY_DESC="Выберите значение приоритета для элементов этого источника данных. Параметр предусмотрен спецификацией XML-карты сайта и полезен для SEO"

COM_JMAP_ELEMENTS_CHANGEFREQUENCY="Частота изменения элементов"
COM_JMAP_ELEMENTS_CHANGEFREQUENCY_DESC="Укажите, как часто меняются элементы этого источника данных. Параметр предусмотрен спецификацией XML-карты сайта и полезен для SEO"

COM_JMAP_ELEMENTS_INCLUDE="Включать элементы в XML-карту сайта"
COM_JMAP_ELEMENTS_INCLUDE_DESC="Укажите, включать ли элементы этого источника в XML-карту сайта для Google и других поисковых систем. При значении «Нет» элементы останутся в HTML-карте, но в XML-карту не попадут"

COM_JMAP_HTML_ELEMENTS_INCLUDE="Включать элементы в HTML-карту сайта"
COM_JMAP_HTML_ELEMENTS_INCLUDE_DESC="Укажите, включать ли элементы этого источника в HTML-карту сайта. При значении «Нет» элементы в неё не попадут"

COM_JMAP_RSS_ELEMENTS_INCLUDE="Включать элементы в RSS-ленту"
COM_JMAP_RSS_ELEMENTS_INCLUDE_DESC="Укажите, включать ли элементы этого источника в RSS-ленту. При значении «Нет» элементы в неё не попадут"

COM_JMAP_ELEMENTS_IMAGESINCLUDE="Включать элементы в XML-карту изображений"
COM_JMAP_ELEMENTS_IMAGESINCLUDE_DESC="Укажите, включать ли элементы этого источника в XML-карту изображений. При значении «Нет» элементы останутся в HTML- и XML-картах, но в карту изображений не попадут. Это полезно, если на таких страницах нет изображений или если элементов слишком много и их исключение экономит ресурсы сервера."

COM_JMAP_ELEMENTS_IMAGES_FILTERINCLUDE="Что включать в карту изображений"
COM_JMAP_ELEMENTS_IMAGES_FILTERINCLUDE_DESC="Укажите через запятую список фрагментов, которые должны встречаться в теге img, чтобы изображение попало в XML-карту изображений. Например, при наличии img src='/images/M_images/pdf_button.png', img src='/images/banners/osmbanner1.png' и img src='/images/stories/myimage.png' можно указать «banner,stories» — тогда в карту попадут только баннеры и изображения материалов, а значок PDF из комплекта Joomla будет пропущен. "

COM_JMAP_ELEMENTS_IMAGES_FILTEREXCLUDE="Что исключать из карты изображений"
COM_JMAP_ELEMENTS_IMAGES_FILTEREXCLUDE_DESC="Укажите через запятую список фрагментов, при наличии которых в теге img изображение не попадёт в XML-карту изображений. Например, при наличии img src='/images/M_images/pdf_button.png', img src='/images/banners/osmbanner1.png' и img src='/images/stories/myimage.png' можно указать «pdf» — тогда значок PDF из комплекта Joomla в карту не попадёт. "

COM_JMAP_ELEMENTS_VIDEOSINCLUDE="Включать элементы в XML-карту видео"
COM_JMAP_ELEMENTS_VIDEOSINCLUDE_DESC="Укажите, включать ли элементы этого источника в XML-карту видео. При значении «Нет» элементы останутся в HTML- и XML-картах, но в карту видео не попадут. Это полезно, если на таких страницах нет видео или если элементов слишком много и их исключение экономит ресурсы сервера."

COM_JMAP_ELEMENTS_VIDEOS_FILTERINCLUDE="Что включать в карту видео"
COM_JMAP_ELEMENTS_VIDEOS_FILTERINCLUDE_DESC="Укажите через запятую список слов, которые должны встречаться в названии видео, чтобы оно попало в XML-карту видео. Например, при наличии видео с названиями «Joomla! the award winning CMS», «Drupal a new concept of CMS» и «Wordpress the king blog platform» можно указать «joomla, drupal» — тогда в карту попадут только первые два."

COM_JMAP_ELEMENTS_VIDEOS_FILTEREXCLUDE="Что исключать из карты видео"
COM_JMAP_ELEMENTS_VIDEOS_FILTEREXCLUDE_DESC="Укажите через запятую список слов, при наличии которых в названии видео оно не попадёт в XML-карту видео. Например, при наличии видео с названиями «Joomla! the award winning CMS», «Drupal a new concept of CMS» и «Wordpress the king blog platform» можно указать «wordpress» — тогда в карту попадут только первые два."

COM_JMAP_CDN_PROTOCOL="Протокол для изображений на CDN"
COM_JMAP_CDN_PROTOCOL_DESC="Если изображения размещены на CDN и их адреса неполные, например «//cdn.host.com/image.png», укажите недостающий протокол — скажем, «http:» — и в карту попадёт правильный адрес «https://cdn.host.com/image.png»"

COM_JMAP_CRAWLER_INFO="Посмотреть, что именно видит обходчик изображений и видео при посещении сайта"
